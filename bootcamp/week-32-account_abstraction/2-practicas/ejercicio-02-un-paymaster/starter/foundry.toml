# ¿Qué? Configuración de Foundry de un ejercicio o proyecto del bootcamp.
# ¿Para qué? Fijar compilador y bibliotecas para que el resultado sea idéntico en cualquier contenedor.
[profile.default]
src = "src"
test = "test"
out = "out"
# ¿Qué? forge-std, OpenZeppelin y, desde la semana 32, los contratos de ERC-4337 de eth-infinitism
#   viven en la imagen (/opt/lib), no dentro del proyecto.
libs = ["/opt/lib"]
remappings = [
    "forge-std/=/opt/lib/forge-std/src/",
    "@openzeppelin/contracts/=/opt/lib/openzeppelin-contracts/contracts/",
    "@account-abstraction/contracts/=/opt/lib/account-abstraction/",
]
solc_version = "0.8.38"
# ¿Qué? Sin red: solc ya está en la imagen.
# ¿Impacto? Un número de versión mal escrito falla al instante en vez de intentar descargar.
offline = true
# ¿Qué? Sin los warnings de solc del código de eth-infinitism, desde la semana 32.
# ¿Para qué? solc 0.8.38 avisa de que `error` será una palabra reservada, y BaseAccount (v0.8.0)
#   tiene un parámetro que se llama así. Es el código del EntryPoint de mainnet: no se toca.
# ¿Impacto? Solo esa carpeta: un warning de tu código sigue apareciendo.
ignored_warnings_from = ["/opt/lib/account-abstraction"]
