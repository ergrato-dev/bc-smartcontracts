<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" role="img" aria-label="Una EOA que delegó con EIP-7702 tiene como código el designador 0xef0100 más la dirección del contrato. Quien la llama ejecuta el código del contrato con el storage y el saldo de la EOA. La clave privada sigue pudiendo firmar transacciones y cambiar la delegación">
  <title>Una EOA delegada</title>
  <rect width="760" height="380" fill="#0d1117"/>
  <rect x="20" y="40" width="220" height="80" rx="8" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
  <text x="130.0" y="76.0" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" fill="#f0f6fc">Quien llama</text>
  <text x="130.0" y="94.0" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#8b949e">bundler, EntryPoint o la EOA</text>
  <rect x="290" y="30" width="200" height="100" rx="8" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
  <text x="390.0" y="62" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" fill="#f0f6fc">EOA de alice</text>
  <text x="390" y="95" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#8b949e">código: 0xef0100 ++ contrato</text>
  <text x="390" y="113" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#8b949e">storage y saldo de alice</text>
  <rect x="540" y="40" width="200" height="80" rx="8" fill="#161b22" stroke="#8fa4f0" stroke-width="2"/>
  <text x="640.0" y="76.0" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" fill="#f0f6fc">BatchDelegate</text>
  <text x="640.0" y="94.0" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#8b949e">el código que se ejecuta</text>
  <line x1="240" y1="80" x2="278.0" y2="80.0" stroke="#8b949e" stroke-width="2"/>
  <polygon points="288.0,80.0 278.0,85.0 278.0,75.0" fill="#8b949e"/>
  <text x="264" y="70" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#8b949e">call</text>
  <line x1="490" y1="80" x2="528.0" y2="80.0" stroke="#8b949e" stroke-width="2"/>
  <polygon points="538.0,80.0 528.0,85.0 528.0,75.0" fill="#8b949e"/>
  <text x="514" y="70" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#8b949e">ejecuta</text>
  <rect x="290" y="200" width="200" height="70" rx="8" fill="#161b22" stroke="#e3b341" stroke-width="2"/>
  <text x="390.0" y="231.0" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" fill="#f0f6fc">Clave privada</text>
  <text x="390.0" y="249.0" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#8b949e">firma autorizaciones y txs</text>
  <line x1="390" y1="198" x2="390.0" y2="142.0" stroke="#8b949e" stroke-width="2"/>
  <polygon points="390.0,132.0 395.0,142.0 385.0,142.0" fill="#8b949e"/>
  <text x="400" y="170" text-anchor="start" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#8b949e">cambia o quita la delegación</text>
  <rect x="20" y="300" width="720" height="60" rx="10" fill="none" stroke="#f85149" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="32" y="322" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#f85149">Lo que no cambia al delegar</text>
  <text x="380" y="345" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#8b949e">misma dirección · mismo storage (también lo de delegaciones anteriores) · la clave manda</text>
</svg>
