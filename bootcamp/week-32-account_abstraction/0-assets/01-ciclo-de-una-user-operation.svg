<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" role="img" aria-label="El usuario firma una UserOperation; el bundler la envía en handleOps; el EntryPoint valida con la fábrica, la cuenta y el paymaster, después ejecuta la llamada de la cuenta y paga al bundler">
  <title>El ciclo de una UserOperation</title>
  <rect width="760" height="430" fill="#0d1117"/>
  <rect x="20" y="30" width="170" height="60" rx="8" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
  <text x="105.0" y="56.0" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" fill="#f0f6fc">Usuario</text>
  <text x="105.0" y="74.0" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#8b949e">firma la UserOperation</text>
  <rect x="295" y="30" width="170" height="60" rx="8" fill="#161b22" stroke="#e3b341" stroke-width="2"/>
  <text x="380.0" y="56.0" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" fill="#f0f6fc">Bundler</text>
  <text x="380.0" y="74.0" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#8b949e">handleOps(ops, beneficiary)</text>
  <rect x="570" y="30" width="170" height="60" rx="8" fill="#161b22" stroke="#8fa4f0" stroke-width="2"/>
  <text x="655.0" y="56.0" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" fill="#f0f6fc">EntryPoint</text>
  <text x="655.0" y="74.0" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#8b949e">v0.8.0</text>
  <line x1="190" y1="60" x2="283.0" y2="60.0" stroke="#8b949e" stroke-width="2"/>
  <polygon points="293.0,60.0 283.0,65.0 283.0,55.0" fill="#8b949e"/>
  <text x="242" y="50" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#8b949e">mempool</text>
  <line x1="465" y1="60" x2="558.0" y2="60.0" stroke="#8b949e" stroke-width="2"/>
  <polygon points="568.0,60.0 558.0,65.0 558.0,55.0" fill="#8b949e"/>
  <text x="517" y="50" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#8b949e">transacción</text>
  <line x1="655" y1="90" x2="655.0" y2="110.0" stroke="#8b949e" stroke-width="2"/>
  <polygon points="655.0,120.0 650.0,110.0 660.0,110.0" fill="#8b949e"/>
  <rect x="20" y="125" width="350" height="285" rx="10" fill="none" stroke="#58a6ff" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="32" y="147" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#58a6ff">1. Validación (para cada operación)</text>
  <rect x="40" y="160" width="310" height="60" rx="8" fill="#161b22" stroke="#8b949e" stroke-width="2"/>
  <text x="195.0" y="186.0" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" fill="#f0f6fc">Fábrica, si hay initCode</text>
  <text x="195.0" y="204.0" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#8b949e">createWallet: despliega en sender</text>
  <rect x="40" y="240" width="310" height="60" rx="8" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
  <text x="195.0" y="266.0" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" fill="#f0f6fc">cuenta.validateUserOp</text>
  <text x="195.0" y="284.0" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#8b949e">firma → 0 o 1; paga el prefund</text>
  <rect x="40" y="320" width="310" height="60" rx="8" fill="#161b22" stroke="#e3b341" stroke-width="2"/>
  <text x="195.0" y="346.0" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" fill="#f0f6fc">paymaster.validatePaymasterUserOp</text>
  <text x="195.0" y="364.0" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#8b949e">si hay paymaster: paga él</text>
  <line x1="195" y1="220" x2="195.0" y2="228.0" stroke="#8b949e" stroke-width="2"/>
  <polygon points="195.0,238.0 190.0,228.0 200.0,228.0" fill="#8b949e"/>
  <line x1="195" y1="300" x2="195.0" y2="308.0" stroke="#8b949e" stroke-width="2"/>
  <polygon points="195.0,318.0 190.0,308.0 200.0,308.0" fill="#8b949e"/>
  <rect x="390" y="125" width="350" height="285" rx="10" fill="none" stroke="#3fb950" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="402" y="147" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#3fb950">2. Ejecución (para cada operación)</text>
  <rect x="410" y="160" width="310" height="60" rx="8" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
  <text x="565.0" y="186.0" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" fill="#f0f6fc">cuenta.execute(...)</text>
  <text x="565.0" y="204.0" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#8b949e">la llamada de callData</text>
  <rect x="410" y="240" width="310" height="60" rx="8" fill="#161b22" stroke="#8b949e" stroke-width="2"/>
  <text x="565.0" y="266.0" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" fill="#f0f6fc">postOp del paymaster</text>
  <text x="565.0" y="284.0" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#8b949e">si devolvió context</text>
  <rect x="410" y="320" width="310" height="60" rx="8" fill="#161b22" stroke="#e3b341" stroke-width="2"/>
  <text x="565.0" y="346.0" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" fill="#f0f6fc">Cobro</text>
  <text x="565.0" y="364.0" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#8b949e">gas real al bundler; el resto, al depósito</text>
  <line x1="565" y1="220" x2="565.0" y2="228.0" stroke="#8b949e" stroke-width="2"/>
  <polygon points="565.0,238.0 560.0,228.0 570.0,228.0" fill="#8b949e"/>
  <line x1="565" y1="300" x2="565.0" y2="308.0" stroke="#8b949e" stroke-width="2"/>
  <polygon points="565.0,318.0 560.0,308.0 570.0,308.0" fill="#8b949e"/>
  <line x1="370" y1="190" x2="398.0" y2="190.0" stroke="#8b949e" stroke-width="2"/>
  <polygon points="408.0,190.0 398.0,195.0 398.0,185.0" fill="#8b949e"/>
</svg>
