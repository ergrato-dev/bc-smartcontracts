<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" role="img" aria-label="El EntryPoint pregunta al paymaster en la validación y descuenta maxCost de su depósito; ejecuta la llamada de la cuenta; llama a postOp con el coste hasta ese momento; paga al bundler y devuelve el resto al depósito">
  <title>Un paymaster en el ciclo</title>
  <rect width="760" height="400" fill="#0d1117"/>
  <rect x="20" y="40" width="200" height="70" rx="8" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
  <text x="120.0" y="71.0" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" fill="#f0f6fc">Cuenta (sin ETH)</text>
  <text x="120.0" y="89.0" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#8b949e">firma la operación</text>
  <rect x="280" y="40" width="200" height="70" rx="8" fill="#161b22" stroke="#8fa4f0" stroke-width="2"/>
  <text x="380.0" y="71.0" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" fill="#f0f6fc">EntryPoint</text>
  <text x="380.0" y="89.0" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#8b949e">depósito del paymaster</text>
  <rect x="540" y="40" width="200" height="70" rx="8" fill="#161b22" stroke="#e3b341" stroke-width="2"/>
  <text x="640.0" y="71.0" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" fill="#f0f6fc">Paymaster</text>
  <text x="640.0" y="89.0" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#8b949e">las reglas</text>
  <line x1="220" y1="75" x2="268.0" y2="75.0" stroke="#8b949e" stroke-width="2"/>
  <polygon points="278.0,75.0 268.0,80.0 268.0,70.0" fill="#8b949e"/>
  <line x1="480" y1="65" x2="528.0" y2="65.0" stroke="#8b949e" stroke-width="2"/>
  <polygon points="538.0,65.0 528.0,70.0 528.0,60.0" fill="#8b949e"/>
  <text x="510" y="57" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#8b949e">1</text>
  <line x1="538" y1="90" x2="492.0" y2="90.0" stroke="#8b949e" stroke-width="2"/>
  <polygon points="482.0,90.0 492.0,85.0 492.0,95.0" fill="#8b949e"/>
  <text x="560" y="132" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#8b949e">context, validationData</text>
  <rect x="280" y="170" width="200" height="60" rx="8" fill="#161b22" stroke="#f85149" stroke-width="2"/>
  <text x="380.0" y="196.0" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" fill="#f0f6fc">Reserva</text>
  <text x="380.0" y="214.0" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#8b949e">depósito − maxCost</text>
  <line x1="380" y1="110" x2="380.0" y2="158.0" stroke="#8b949e" stroke-width="2"/>
  <polygon points="380.0,168.0 375.0,158.0 385.0,158.0" fill="#8b949e"/>
  <text x="395" y="145" text-anchor="start" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#8b949e">2</text>
  <rect x="20" y="170" width="200" height="60" rx="8" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
  <text x="120.0" y="196.0" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" fill="#f0f6fc">cuenta.execute</text>
  <text x="120.0" y="214.0" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#8b949e">la llamada patrocinada</text>
  <line x1="278" y1="200" x2="232.0" y2="200.0" stroke="#8b949e" stroke-width="2"/>
