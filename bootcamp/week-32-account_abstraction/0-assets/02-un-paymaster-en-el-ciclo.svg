  <text x="250" y="190" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#8b949e">3</text>
  <rect x="540" y="170" width="200" height="60" rx="8" fill="#161b22" stroke="#e3b341" stroke-width="2"/>
  <text x="640.0" y="196.0" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" fill="#f0f6fc">postOp</text>
  <text x="640.0" y="214.0" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#8b949e">actualGasCost (sin el suyo)</text>
  <line x1="482" y1="200" x2="528.0" y2="200.0" stroke="#8b949e" stroke-width="2"/>
  <polygon points="538.0,200.0 528.0,205.0 528.0,195.0" fill="#8b949e"/>
  <text x="510" y="190" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#8b949e">4</text>
  <rect x="150" y="290" width="200" height="70" rx="8" fill="#161b22" stroke="#e3b341" stroke-width="2"/>
  <text x="250.0" y="321.0" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" fill="#f0f6fc">Bundler</text>
  <text x="250.0" y="339.0" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#8b949e">cobra el gas real</text>
  <rect x="410" y="290" width="200" height="70" rx="8" fill="#161b22" stroke="#8fa4f0" stroke-width="2"/>
  <text x="510.0" y="321.0" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" fill="#f0f6fc">Depósito</text>
  <text x="510.0" y="339.0" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#8b949e">recupera lo que sobra</text>
  <line x1="350" y1="230" x2="287.7" y2="281.6" stroke="#8b949e" stroke-width="2"/>
  <polygon points="280.0,288.0 284.5,277.8 290.9,285.5" fill="#8b949e"/>
  <line x1="410" y1="230" x2="472.3" y2="281.6" stroke="#8b949e" stroke-width="2"/>
  <polygon points="480.0,288.0 469.1,285.5 475.5,277.8" fill="#8b949e"/>
  <text x="380" y="268" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#8b949e">5</text>
</svg>
