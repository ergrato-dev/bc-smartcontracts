<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" role="img" aria-label="Orden de ejecución de enterMany con los modificadores whenOpen, validAmount y withinLimit. Cada modificador envuelve al siguiente: whenOpen comprueba antes de su guion bajo, validAmount comprueba antes del suyo, withinLimit ejecuta primero el cuerpo de la función en su guion bajo y comprueba después. El orden es: comprobar abierta, comprobar cantidad, cuerpo de la función, comprobar aforo. Si cualquier comprobación revierte, todo se deshace, incluido el cuerpo.">
  <title>Orden de los modificadores</title>
  <rect width="900" height="380" fill="#0d1117"/>
  <g font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif">
    <text x="450" y="34" font-size="17" fill="#f0f6fc" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">enterMany(amount) whenOpen validAmount(amount) withinLimit</text>

    <rect x="20" y="56" width="560" height="304" rx="8" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
    <text x="40" y="84" font-size="15" font-weight="700" fill="#58a6ff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">whenOpen</text>
    <text x="200" y="84" font-size="13" fill="#f0f6fc">① comprueba isOpen, luego _</text>

    <rect x="50" y="102" width="500" height="238" rx="8" fill="#0d1117" stroke="#e3b341" stroke-width="2"/>
    <text x="70" y="130" font-size="15" font-weight="700" fill="#e3b341" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">validAmount</text>
    <text x="230" y="130" font-size="13" fill="#f0f6fc">② comprueba amount, luego _</text>

    <rect x="80" y="148" width="440" height="172" rx="8" fill="#161b22" stroke="#f0883e" stroke-width="2"/>
    <text x="100" y="176" font-size="15" font-weight="700" fill="#f0883e" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">withinLimit</text>
    <text x="250" y="176" font-size="13" fill="#f0f6fc">primero _, luego ④</text>

    <rect x="110" y="196" width="380" height="64" rx="8" fill="#0d1117" stroke="#3fb950" stroke-width="2"/>
    <text x="300" y="234" font-size="14" fill="#3fb950" text-anchor="middle">③ cuerpo de la función: count++</text>
    <text x="300" y="296" font-size="13" fill="#f0f6fc" text-anchor="middle">④ comprueba count &lt;= LIMIT</text>

    <rect x="610" y="56" width="270" height="304" rx="8" fill="#161b22" stroke="#30363d" stroke-width="2"/>
    <text x="745" y="88" font-size="15" font-weight="700" fill="#f0f6fc" text-anchor="middle">Orden real</text>
    <text x="630" y="126" font-size="14" fill="#58a6ff">① ¿abierta?</text>
    <text x="630" y="156" font-size="14" fill="#e3b341">② ¿cantidad válida?</text>
    <text x="630" y="186" font-size="14" fill="#3fb950">③ cuerpo</text>
    <text x="630" y="216" font-size="14" fill="#f0883e">④ ¿dentro del aforo?</text>
    <text x="630" y="264" font-size="13" fill="#8b949e">De izquierda a derecha;</text>
    <text x="630" y="284" font-size="13" fill="#8b949e">cada _ llama al siguiente.</text>
    <text x="630" y="314" font-size="13" fill="#8b949e">Si ④ revierte, ③ también</text>
    <text x="630" y="334" font-size="13" fill="#8b949e">se deshace.</text>
  </g>
</svg>
