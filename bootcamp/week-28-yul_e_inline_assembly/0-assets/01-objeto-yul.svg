<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" role="img" aria-label="Despliegue de un objeto Yul. La transacción de despliegue lleva el bytecode de Counter: 15 bytes de código de despliegue y, detrás, los 47 bytes del objeto runtime como datos. La EVM ejecuta solo el código de despliegue: sstore guarda 7 en el slot 0, datacopy copia los 47 bytes del runtime a la memoria y return los devuelve. Lo que devuelve return es el código que queda en la dirección del contrato. Las llamadas posteriores ejecutan solo ese runtime: el dispatcher, count e increment.">
  <title>Despliegue de un objeto Yul</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#58a6ff"/>
    </marker>
  </defs>
  <rect width="960" height="470" fill="#0d1117"/>
  <g font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif">
    <text x="480" y="38" fill="#f0f6fc" font-size="20" font-weight="600" text-anchor="middle">Un objeto Yul: lo que se despliega y lo que queda</text>

    <text x="40" y="82" fill="#8b949e" font-size="13">TRANSACCIÓN DE DESPLIEGUE: 62 BYTES DE BYTECODE</text>
    <rect x="40" y="94" width="300" height="150" rx="8" fill="#161b22" stroke="#627eea" stroke-width="2"/>
    <text x="60" y="122" fill="#8fa4f0" font-size="15" font-weight="600">code { ... }  ·  15 bytes</text>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#f0f6fc">
      <text x="60" y="152">sstore(0, 7)</text>
      <text x="60" y="176">datacopy(0, dataoffset, datasize)</text>
      <text x="60" y="200">return(0, datasize)</text>
    </g>
    <text x="60" y="228" fill="#8b949e" font-size="13">se ejecuta una vez y desaparece</text>

    <rect x="340" y="94" width="280" height="150" rx="8" fill="#161b22" stroke="#f0883e" stroke-width="2"/>
    <text x="360" y="122" fill="#f0883e" font-size="15" font-weight="600">object "runtime"  ·  47 bytes</text>
    <text x="360" y="152" fill="#8b949e" font-size="13">datos para el código de despliegue:</text>
    <text x="360" y="174" fill="#8b949e" font-size="13">nadie los ejecuta todavía</text>
    <text x="360" y="204" fill="#f0f6fc" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">5f3560e01c8063…</text>

    <path d="M480 244 L480 300" stroke="#58a6ff" stroke-width="2" fill="none" marker-end="url(#a)"/>
    <text x="496" y="270" fill="#58a6ff" font-size="13">datacopy: a la memoria</text>

    <rect x="340" y="306" width="280" height="56" rx="8" fill="#161b22" stroke="#30363d"/>
    <text x="360" y="332" fill="#f0f6fc" font-size="14">memoria 0x00 … 0x2e</text>
    <text x="360" y="352" fill="#8b949e" font-size="13">los 47 bytes del runtime</text>

    <path d="M620 334 L700 334" stroke="#58a6ff" stroke-width="2" fill="none" marker-end="url(#a)"/>
    <text x="628" y="322" fill="#58a6ff" font-size="13">return</text>

    <rect x="706" y="94" width="214" height="268" rx="8" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
    <text x="724" y="122" fill="#3fb950" font-size="15" font-weight="600">Código del contrato</text>
    <text x="724" y="146" fill="#8b949e" font-size="13">en su dirección, para siempre</text>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#f0f6fc">
      <text x="724" y="184">switch selector</text>
      <text x="724" y="208">case count()</text>
      <text x="724" y="232">case increment()</text>
      <text x="724" y="256">default revert</text>
    </g>
    <text x="724" y="292" fill="#8b949e" font-size="13">cada llamada ejecuta</text>
    <text x="724" y="312" fill="#8b949e" font-size="13">solo esto</text>

    <text x="40" y="300" fill="#8b949e" font-size="13">STORAGE DEL CONTRATO</text>
    <rect x="40" y="312" width="250" height="50" rx="8" fill="#161b22" stroke="#e3b341"/>
    <text x="60" y="342" fill="#e3b341" font-size="14" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">slot 0 = 7</text>
    <path d="M150 244 L150 306" stroke="#58a6ff" stroke-width="2" fill="none" marker-end="url(#a)"/>
    <text x="160" y="280" fill="#58a6ff" font-size="13">sstore</text>

    <text x="40" y="410" fill="#8b949e" font-size="14">solc compila los dos objetos por separado y pega el runtime detrás del código de despliegue.</text>
    <text x="40" y="434" fill="#8b949e" font-size="14">dataoffset("runtime") = 15 y datasize("runtime") = 47 son números fijos dentro del bytecode.</text>
  </g>
</svg>
