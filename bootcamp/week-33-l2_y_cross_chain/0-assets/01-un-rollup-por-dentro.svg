<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" role="img" aria-label="Los usuarios envían transacciones al secuenciador de la L2, que produce un bloque cada dos segundos. El batcher publica los lotes comprimidos en blobs de L1 y el proposer publica raíces de estado. En un rollup optimista cada raíz se puede disputar durante siete días; en uno ZK llega con una prueba de validez. Si el secuenciador censura, la transacción se fuerza desde el OptimismPortal de L1.">
  <title>Un rollup por dentro</title>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b949e"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f85149"/></marker></defs>
  <rect width="760" height="440" fill="#0d1117"/>
  <rect x="20" y="20" width="720" height="170" rx="10" fill="none" stroke="#30363d" stroke-width="1.5"/>
  <text x="34" y="42" text-anchor="start" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#8b949e" font-weight="600">L2 (rollup)</text>
  <rect x="40" y="60" width="150" height="64" rx="8" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
  <text x="115.0" y="84.0" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#f0f6fc">Usuarios</text>
  <text x="115.0" y="102.0" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#8b949e">firman transacciones</text>
  <rect x="260" y="60" width="170" height="64" rx="8" fill="#161b22" stroke="#627eea" stroke-width="2"/>
  <text x="345.0" y="84.0" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#f0f6fc">Secuenciador</text>
  <text x="345.0" y="102.0" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#8b949e">ordena y confirma</text>
  <rect x="480" y="72" width="50" height="40" rx="8" fill="#161b22" stroke="#30363d" stroke-width="2"/>
  <text x="505.0" y="97.0" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#f0f6fc">#1</text>
  <rect x="542" y="72" width="50" height="40" rx="8" fill="#161b22" stroke="#30363d" stroke-width="2"/>
  <text x="567.0" y="97.0" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#f0f6fc">#2</text>
  <rect x="604" y="72" width="50" height="40" rx="8" fill="#161b22" stroke="#30363d" stroke-width="2"/>
  <text x="629.0" y="97.0" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#f0f6fc">#3</text>
  <rect x="666" y="72" width="50" height="40" rx="8" fill="#161b22" stroke="#30363d" stroke-width="2"/>
  <text x="691.0" y="97.0" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#f0f6fc">#4</text>
  <text x="604" y="62" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#8b949e">un bloque de L2 cada 2 s</text>
  <path d="M190 92 L258 92" fill="none" stroke="#8b949e" stroke-width="2" marker-end="url(#a)"/>
  <path d="M430 92 L478 92" fill="none" stroke="#8b949e" stroke-width="2" marker-end="url(#a)"/>
  <text x="345" y="146" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#e3b341">confirmación blanda: aún no está en L1</text>
  <rect x="20" y="230" width="720" height="190" rx="10" fill="none" stroke="#30363d" stroke-width="1.5"/>
  <text x="96" y="252" text-anchor="start" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#8b949e" font-weight="600">L1 (Ethereum)</text>
  <rect x="40" y="280" width="190" height="70" rx="8" fill="#161b22" stroke="#f0883e" stroke-width="2"/>
  <text x="135.0" y="300.0" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#f0f6fc">Batcher</text>
  <text x="135.0" y="318.0" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#8b949e">lotes comprimidos</text>
  <text x="135.0" y="334.0" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#8b949e">en blobs (EIP-4844)</text>
  <rect x="285" y="280" width="190" height="70" rx="8" fill="#161b22" stroke="#627eea" stroke-width="2"/>
  <text x="380.0" y="300.0" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#f0f6fc">Proposer</text>
  <text x="380.0" y="318.0" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#8b949e">raíz de estado</text>
  <text x="380.0" y="334.0" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#8b949e">de cada tramo de bloques</text>
  <rect x="530" y="265" width="190" height="52" rx="8" fill="#161b22" stroke="#e3b341" stroke-width="2"/>
  <text x="625.0" y="283.0" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#f0f6fc">Optimista</text>
  <text x="625.0" y="301.0" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#8b949e">7 días para disputar</text>
  <rect x="530" y="327" width="190" height="52" rx="8" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
  <text x="625.0" y="345.0" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#f0f6fc">ZK</text>
  <text x="625.0" y="363.0" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#8b949e">prueba de validez</text>
  <path d="M536 112 L536 176 L135 176 L135 278" fill="none" stroke="#8b949e" stroke-width="2" marker-end="url(#a)"/>
  <text x="150" y="170" text-anchor="start" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#8b949e">datos de las transacciones</text>
  <path d="M660 112 L660 206 L380 206 L380 278" fill="none" stroke="#8b949e" stroke-width="2" marker-end="url(#a)"/>
  <text x="650" y="222" text-anchor="end" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#8b949e">estado tras los bloques</text>
  <path d="M475 305 L528 291" fill="none" stroke="#8b949e" stroke-width="2" marker-end="url(#a)"/>
  <path d="M475 325 L528 353" fill="none" stroke="#8b949e" stroke-width="2" marker-end="url(#a)"/>
  <rect x="40" y="370" width="190" height="40" rx="8" fill="#161b22" stroke="#f85149" stroke-width="2"/>
  <text x="135.0" y="395.0" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#f0f6fc">OptimismPortal</text>
  <path d="M70 368 L70 128" fill="none" stroke="#f85149" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#r)"/>
  <text x="80" y="212" text-anchor="start" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#f85149">inclusión forzada</text>
</svg>
