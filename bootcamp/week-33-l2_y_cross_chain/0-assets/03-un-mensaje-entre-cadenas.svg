<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" role="img" aria-label="El timelock de L1 llama a sendMessage del mensajero de L1, que emite SentMessage con su nonce. El rollup lo lleva a la L2 y llama a relayMessage del mensajero de L2, que fija xDomainMessageSender al timelock y llama al ejecutor. El ejecutor comprueba que quien llama es el mensajero y que el remitente es el timelock, y llama al registro. Un atacante que llama al ejecutor directamente falla con NotMessenger; uno que envía su propio mensaje desde L1 falla con NotL1Dao.">
  <title>Un mensaje entre cadenas</title>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b949e"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f85149"/></marker></defs>
  <rect width="760" height="470" fill="#0d1117"/>
  <rect x="20" y="20" width="330" height="430" rx="10" fill="none" stroke="#30363d" stroke-width="1.5"/>
  <text x="34" y="42" text-anchor="start" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#8b949e" font-weight="600">L1</text>
  <rect x="410" y="20" width="330" height="430" rx="10" fill="none" stroke="#30363d" stroke-width="1.5"/>
  <text x="424" y="42" text-anchor="start" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#8b949e" font-weight="600">L2</text>
  <rect x="45" y="55" width="280" height="60" rx="8" fill="#161b22" stroke="#627eea" stroke-width="2"/>
  <text x="185.0" y="77.0" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#f0f6fc">Timelock de la DAO</text>
  <text x="185.0" y="95.0" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#8b949e">propuesta aprobada</text>
  <rect x="45" y="165" width="280" height="70" rx="8" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
  <text x="185.0" y="185.0" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#f0f6fc">Mensajero de L1</text>
  <text x="185.0" y="203.0" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#8b949e">sendMessage(ejecutor, data, gas)</text>
  <text x="185.0" y="219.0" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#8b949e">emit SentMessage(..., nonce)</text>
  <path d="M185 115 L185 163" fill="none" stroke="#8b949e" stroke-width="2" marker-end="url(#a)"/>
  <rect x="435" y="165" width="280" height="70" rx="8" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
  <text x="575.0" y="185.0" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#f0f6fc">Mensajero de L2</text>
  <text x="575.0" y="203.0" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#8b949e">relayMessage(nonce, timelock, ...)</text>
  <text x="575.0" y="219.0" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#8b949e">xDomainMessageSender = timelock</text>
  <path d="M325 200 L433 200" fill="none" stroke="#8b949e" stroke-width="2" marker-end="url(#a)"/>
  <text x="380" y="192" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#8b949e">rollup</text>
  <rect x="435" y="280" width="280" height="80" rx="8" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
  <text x="575.0" y="305.0" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#f0f6fc">L2Executor</text>
  <text x="575.0" y="323.0" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#8b949e">1 msg.sender == mensajero</text>
  <text x="575.0" y="339.0" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#8b949e">2 remitente == timelock</text>
  <path d="M575 235 L575 278" fill="none" stroke="#8b949e" stroke-width="2" marker-end="url(#a)"/>
  <rect x="435" y="390" width="280" height="46" rx="8" fill="#161b22" stroke="#627eea" stroke-width="2"/>
  <text x="575.0" y="405.0" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#f0f6fc">RegistryV3 de la L2</text>
  <text x="575.0" y="423.0" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#8b949e">setFeeConfig(...)</text>
  <path d="M575 360 L575 388" fill="none" stroke="#8b949e" stroke-width="2" marker-end="url(#a)"/>
  <rect x="45" y="300" width="280" height="60" rx="8" fill="#161b22" stroke="#f85149" stroke-width="2"/>
  <text x="185.0" y="322.0" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#f0f6fc">Atacante</text>
  <text x="185.0" y="340.0" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#8b949e">sin votos</text>
  <path d="M325 318 L433 305" fill="none" stroke="#f85149" stroke-width="2" marker-end="url(#r)"/>
  <text x="385" y="290" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#f85149">NotMessenger</text>
  <path d="M130 298 L130 237" fill="none" stroke="#f85149" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#r)"/>
  <text x="140" y="272" text-anchor="start" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#f85149">su propio mensaje: NotL1Dao</text>
</svg>
