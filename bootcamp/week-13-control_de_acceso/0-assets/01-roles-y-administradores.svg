<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" role="img" aria-label="Tres columnas: cuentas, roles y funciones. La cuenta 0 tiene DEFAULT_ADMIN_ROLE, que da y quita todos los roles. La cuenta 1 tiene OPERATOR_ROLE, que abre setTemperature. Una moderadora tiene MODERATOR_ROLE, que abre remove, y un editor tiene EDITOR_ROLE, que abre publish. A la izquierda de los roles, flechas naranjas marcan quién administra a quién: DEFAULT_ADMIN_ROLE administra OPERATOR_ROLE y MODERATOR_ROLE, y, con _setRoleAdmin, MODERATOR_ROLE administra EDITOR_ROLE. Abajo: quien administra un rol puede darse ese rol.">
  <title>Roles y administradores</title>
  <rect width="900" height="440" fill="#0d1117"/>
  <defs>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#58a6ff"/>
    </marker>
    <marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#f0883e"/>
    </marker>
  </defs>
  <g font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif">
    <text x="450" y="32" font-size="19" font-weight="700" fill="#f0f6fc" text-anchor="middle">Cada función pide un rol; cada rol tiene un rol administrador</text>

    <text x="110" y="70" font-size="13" font-weight="700" fill="#8b949e" text-anchor="middle">CUENTAS</text>
    <text x="450" y="70" font-size="13" font-weight="700" fill="#8b949e" text-anchor="middle">ROLES</text>
    <text x="760" y="70" font-size="13" font-weight="700" fill="#8b949e" text-anchor="middle">FUNCIONES</text>

    <g font-size="13" fill="#f0f6fc" text-anchor="middle">
      <rect x="40" y="88" width="140" height="48" rx="8" fill="#161b22" stroke="#30363d"/>
      <text x="110" y="117">Cuenta 0</text>
      <rect x="40" y="168" width="140" height="48" rx="8" fill="#161b22" stroke="#30363d"/>
      <text x="110" y="197">Cuenta 1</text>
      <rect x="40" y="248" width="140" height="48" rx="8" fill="#161b22" stroke="#30363d"/>
      <text x="110" y="277">Moderadora</text>
      <rect x="40" y="328" width="140" height="48" rx="8" fill="#161b22" stroke="#30363d"/>
      <text x="110" y="357">Editor</text>
    </g>

    <g stroke="#58a6ff" stroke-width="2">
      <line x1="180" y1="112" x2="342" y2="112" marker-end="url(#b)"/>
      <line x1="180" y1="192" x2="342" y2="192" marker-end="url(#b)"/>
      <line x1="180" y1="272" x2="342" y2="272" marker-end="url(#b)"/>
      <line x1="180" y1="352" x2="342" y2="352" marker-end="url(#b)"/>
      <line x1="560" y1="112" x2="642" y2="112" marker-end="url(#b)"/>
      <line x1="560" y1="192" x2="642" y2="192" marker-end="url(#b)"/>
      <line x1="560" y1="272" x2="642" y2="272" marker-end="url(#b)"/>
      <line x1="560" y1="352" x2="642" y2="352" marker-end="url(#b)"/>
    </g>
    <text x="262" y="104" font-size="11" fill="#8b949e" text-anchor="middle">hasRole</text>

    <g font-size="13" fill="#f0f6fc" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
      <rect x="350" y="88" width="210" height="48" rx="8" fill="#161b22" stroke="#627eea" stroke-width="2"/>
      <text x="455" y="110">DEFAULT_ADMIN_ROLE</text>
      <text x="455" y="127" font-size="11" fill="#8b949e">0x00</text>
      <rect x="350" y="168" width="210" height="48" rx="8" fill="#161b22" stroke="#627eea"/>
      <text x="455" y="197">OPERATOR_ROLE</text>
      <rect x="350" y="248" width="210" height="48" rx="8" fill="#161b22" stroke="#627eea"/>
      <text x="455" y="277">MODERATOR_ROLE</text>
      <rect x="350" y="328" width="210" height="48" rx="8" fill="#161b22" stroke="#627eea"/>
      <text x="455" y="357">EDITOR_ROLE</text>

      <rect x="650" y="88" width="220" height="48" rx="8" fill="#161b22" stroke="#30363d"/>
      <text x="760" y="110">grantRole</text>
      <text x="760" y="127">revokeRole</text>
      <rect x="650" y="168" width="220" height="48" rx="8" fill="#161b22" stroke="#30363d"/>
      <text x="760" y="197">setTemperature</text>
      <rect x="650" y="248" width="220" height="48" rx="8" fill="#161b22" stroke="#30363d"/>
      <text x="760" y="277">remove</text>
      <rect x="650" y="328" width="220" height="48" rx="8" fill="#161b22" stroke="#30363d"/>
      <text x="760" y="357">publish</text>
    </g>

    <g stroke="#f0883e" stroke-width="2" fill="none" stroke-dasharray="6 4">
      <path d="M350 104 C 318 120, 318 176, 348 184" marker-end="url(#o)"/>
      <path d="M350 120 C 290 150, 290 250, 348 264" marker-end="url(#o)"/>
      <path d="M350 284 C 318 300, 318 336, 348 344" marker-end="url(#o)"/>
    </g>
    <text x="296" y="150" font-size="11" fill="#f0883e" text-anchor="end">administra</text>
    <text x="312" y="318" font-size="11" fill="#f0883e" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">_setRoleAdmin</text>

    <text x="450" y="415" font-size="13" fill="#8b949e" text-anchor="middle">Quien administra un rol puede dárselo a sí mismo: la moderadora puede hacerse editora.</text>
  </g>
</svg>
