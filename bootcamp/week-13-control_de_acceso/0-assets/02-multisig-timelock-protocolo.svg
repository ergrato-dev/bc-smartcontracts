<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-label="Tres dueños, dos de ellos confirman, y el multisig de dos de tres programa una llamada en el timelock con schedule. El timelock emite CallScheduled, que los usuarios ven, y espera al menos el plazo mínimo; durante la espera los usuarios pueden retirar sus fondos. Pasado el plazo, cualquiera llama a execute y el timelock, que tiene DEFAULT_ADMIN_ROLE, llama al protocolo, por ejemplo setHook. Aparte, un guardián con PAUSER_ROLE llama a pause directamente, sin plazo.">
  <title>Multisig, timelock y protocolo</title>
  <rect width="900" height="420" fill="#0d1117"/>
  <defs>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#58a6ff"/>
    </marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#f85149"/>
    </marker>
    <marker id="s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#8b949e"/>
    </marker>
  </defs>
  <g font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif">
    <text x="450" y="32" font-size="19" font-weight="700" fill="#f0f6fc" text-anchor="middle">Un cambio de configuración pasa por dos filtros; la pausa, por ninguno</text>

    <g font-size="13" fill="#f0f6fc" text-anchor="middle">
      <rect x="30" y="70" width="110" height="40" rx="8" fill="#161b22" stroke="#3fb950"/>
      <text x="85" y="95">Dueña 1 ✓</text>
      <rect x="30" y="122" width="110" height="40" rx="8" fill="#161b22" stroke="#3fb950"/>
      <text x="85" y="147">Dueño 2 ✓</text>
      <rect x="30" y="174" width="110" height="40" rx="8" fill="#161b22" stroke="#30363d"/>
      <text x="85" y="199" fill="#8b949e">Dueña 3</text>
    </g>
    <g stroke="#8b949e" stroke-width="2">
      <line x1="140" y1="90" x2="192" y2="130" marker-end="url(#s)"/>
      <line x1="140" y1="142" x2="192" y2="142" marker-end="url(#s)"/>
    </g>

    <rect x="200" y="106" width="150" height="72" rx="8" fill="#161b22" stroke="#627eea" stroke-width="2"/>
    <text x="275" y="136" font-size="15" font-weight="700" fill="#f0f6fc" text-anchor="middle">Multisig</text>
    <text x="275" y="158" font-size="13" fill="#8b949e" text-anchor="middle">2 de 3</text>

    <line x1="350" y1="142" x2="432" y2="142" stroke="#58a6ff" stroke-width="2" marker-end="url(#b)"/>
    <text x="391" y="134" font-size="12" fill="#58a6ff" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">schedule</text>

    <rect x="440" y="96" width="190" height="92" rx="8" fill="#161b22" stroke="#627eea" stroke-width="2"/>
    <text x="535" y="124" font-size="15" font-weight="700" fill="#f0f6fc" text-anchor="middle">Timelock</text>
    <text x="535" y="146" font-size="13" fill="#f0f6fc" text-anchor="middle">espera ≥ plazo mínimo</text>
    <text x="535" y="168" font-size="12" fill="#8b949e" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">CallScheduled</text>

    <line x1="630" y1="142" x2="712" y2="142" stroke="#58a6ff" stroke-width="2" marker-end="url(#b)"/>
    <text x="671" y="134" font-size="12" fill="#58a6ff" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">execute</text>

    <rect x="720" y="86" width="150" height="190" rx="8" fill="#161b22" stroke="#627eea" stroke-width="2"/>
    <text x="795" y="114" font-size="15" font-weight="700" fill="#f0f6fc" text-anchor="middle">Protocolo</text>
    <text x="795" y="142" font-size="11" fill="#8b949e" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">DEFAULT_ADMIN_ROLE</text>
    <text x="795" y="160" font-size="12" fill="#f0f6fc" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">el timelock</text>
    <text x="795" y="226" font-size="11" fill="#8b949e" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">PAUSER_ROLE</text>
    <text x="795" y="244" font-size="12" fill="#f0f6fc" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">el guardián</text>

    <line x1="535" y1="188" x2="535" y2="242" stroke="#8b949e" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#s)"/>
    <rect x="440" y="250" width="190" height="52" rx="8" fill="#161b22" stroke="#30363d"/>
    <text x="535" y="272" font-size="13" fill="#f0f6fc" text-anchor="middle">Usuarios: ven el cambio</text>
    <text x="535" y="291" font-size="13" fill="#f0f6fc" text-anchor="middle">y pueden salir antes</text>

    <rect x="200" y="330" width="150" height="52" rx="8" fill="#161b22" stroke="#f85149"/>
    <text x="275" y="352" font-size="15" font-weight="700" fill="#f0f6fc" text-anchor="middle">Guardián</text>
    <text x="275" y="371" font-size="12" fill="#8b949e" text-anchor="middle">una cuenta de guardia</text>
    <path d="M350 356 L 795 356 L 795 284" fill="none" stroke="#f85149" stroke-width="2" marker-end="url(#r)"/>
    <text x="580" y="348" font-size="12" fill="#f85149" text-anchor="middle"><tspan font-family="ui-monospace, SFMono-Regular, Menlo, monospace">pause</tspan>, sin plazo</text>
  </g>
</svg>
