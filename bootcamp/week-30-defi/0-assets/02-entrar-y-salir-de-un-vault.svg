<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" role="img" aria-label="Las cuatro funciones de un vault ERC-4626: deposit y mint meten activo y dan shares, withdraw y redeem queman shares y devuelven activo; cada una redondea a favor del vault">
  <title>Entrar y salir de un vault</title>
  <rect width="760" height="420" fill="#0d1117"/>
  <rect x="270" y="40" width="220" height="340" rx="10" fill="#161b22" stroke="#627eea" stroke-width="2"/>
  <text x="380" y="72" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16" fill="#8fa4f0">Vault</text>
  <text x="380" y="98" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#f0f6fc">totalAssets()</text>
  <text x="380" y="118" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#f0f6fc">totalSupply()</text>
  <text x="380" y="346" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#8b949e">share = activo / shares</text>
  <text x="380" y="364" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#8b949e">redondea a favor del vault</text>
  <text x="130" y="40" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" fill="#f0f6fc">Tú dices</text>
  <text x="630" y="40" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" fill="#f0f6fc">El vault calcula</text>
  <rect x="30" y="145" width="200" height="32" rx="6" fill="#161b22" stroke="#30363d"/>
  <text x="130" y="166" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#f0f6fc">activo que metes</text>
  <line x1="232" y1="161" x2="290" y2="161" stroke="#58a6ff" stroke-width="2"/>
  <polygon points="290,156 300,161 290,166" fill="#58a6ff"/>
  <text x="380" y="165" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#58a6ff">deposit(assets)</text>
  <line x1="460" y1="161" x2="518" y2="161" stroke="#58a6ff" stroke-width="2"/>
  <polygon points="518,156 528,161 518,166" fill="#58a6ff"/>
  <rect x="530" y="145" width="200" height="32" rx="6" fill="#161b22" stroke="#30363d"/>
  <text x="630" y="163" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#f0f6fc">shares que recibes</text>
  <text x="630" y="175" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#e3b341">↓ hacia abajo</text>
  <rect x="30" y="187" width="200" height="32" rx="6" fill="#161b22" stroke="#30363d"/>
  <text x="130" y="208" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#f0f6fc">shares que quieres</text>
  <line x1="232" y1="203" x2="290" y2="203" stroke="#58a6ff" stroke-width="2"/>
  <polygon points="290,198 300,203 290,208" fill="#58a6ff"/>
  <text x="380" y="207" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#58a6ff">mint(shares)</text>
  <line x1="460" y1="203" x2="518" y2="203" stroke="#58a6ff" stroke-width="2"/>
  <polygon points="518,198 528,203 518,208" fill="#58a6ff"/>
  <rect x="530" y="187" width="200" height="32" rx="6" fill="#161b22" stroke="#30363d"/>
  <text x="630" y="205" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#f0f6fc">activo que pagas</text>
  <text x="630" y="217" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#e3b341">↑ hacia arriba</text>
  <rect x="30" y="255" width="200" height="32" rx="6" fill="#161b22" stroke="#30363d"/>
  <text x="130" y="276" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#f0f6fc">activo que sacas</text>
  <line x1="232" y1="271" x2="290" y2="271" stroke="#3fb950" stroke-width="2"/>
  <polygon points="290,266 300,271 290,276" fill="#3fb950"/>
  <text x="380" y="275" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#3fb950">withdraw(assets)</text>
  <line x1="460" y1="271" x2="518" y2="271" stroke="#3fb950" stroke-width="2"/>
  <polygon points="518,266 528,271 518,276" fill="#3fb950"/>
  <rect x="530" y="255" width="200" height="32" rx="6" fill="#161b22" stroke="#30363d"/>
  <text x="630" y="273" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#f0f6fc">shares que se queman</text>
  <text x="630" y="285" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#e3b341">↑ hacia arriba</text>
  <rect x="30" y="297" width="200" height="32" rx="6" fill="#161b22" stroke="#30363d"/>
  <text x="130" y="318" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#f0f6fc">shares que quemas</text>
  <line x1="232" y1="313" x2="290" y2="313" stroke="#3fb950" stroke-width="2"/>
  <polygon points="290,308 300,313 290,318" fill="#3fb950"/>
  <text x="380" y="317" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#3fb950">redeem(shares)</text>
  <line x1="460" y1="313" x2="518" y2="313" stroke="#3fb950" stroke-width="2"/>
  <polygon points="518,308 528,313 518,318" fill="#3fb950"/>
  <rect x="530" y="297" width="200" height="32" rx="6" fill="#161b22" stroke="#30363d"/>
  <text x="630" y="315" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#f0f6fc">activo que recibes</text>
  <text x="630" y="327" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#e3b341">↓ hacia abajo</text>
  <text x="30" y="132" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#58a6ff">Entrar</text>
  <text x="30" y="244" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#3fb950">Salir</text>
</svg>
