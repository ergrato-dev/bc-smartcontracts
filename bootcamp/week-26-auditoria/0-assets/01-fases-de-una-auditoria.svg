<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-label="Las siete fases de una auditoría: alcance, modelo de amenazas, revisión manual, herramientas, hallazgos, informe y revisión de correcciones. Las fases 3 y 4 se alimentan entre sí, y la revisión de correcciones vuelve a hallazgos si una corrección falla o trae un fallo nuevo.">
  <title>Fases de una auditoría</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#58a6ff"/>
    </marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#f85149"/>
    </marker>
  </defs>
  <rect width="960" height="420" fill="#0d1117"/>
  <g font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif">
    <text x="480" y="40" fill="#f0f6fc" font-size="20" font-weight="600" text-anchor="middle">Fases de una auditoría</text>

    <!-- Fila 1: preparar -->
    <text x="40" y="84" fill="#8b949e" font-size="13">ENTENDER</text>
    <rect x="40" y="96" width="250" height="96" rx="8" fill="#161b22" stroke="#627eea" stroke-width="2"/>
    <text x="60" y="126" fill="#8fa4f0" font-size="15" font-weight="600">1. Alcance</text>
    <text x="60" y="150" fill="#f0f6fc" font-size="13">Qué contratos, qué commit</text>
    <text x="60" y="172" fill="#8b949e" font-size="13">El código ya no cambia</text>

    <rect x="355" y="96" width="250" height="96" rx="8" fill="#161b22" stroke="#627eea" stroke-width="2"/>
    <text x="375" y="126" fill="#8fa4f0" font-size="15" font-weight="600">2. Modelo de amenazas</text>
    <text x="375" y="150" fill="#f0f6fc" font-size="13">Actores, activos, fronteras</text>
    <text x="375" y="172" fill="#8b949e" font-size="13">Qué no debe pasar nunca</text>

    <line x1="290" y1="144" x2="351" y2="144" stroke="#58a6ff" stroke-width="2" marker-end="url(#a)"/>

    <!-- Fila 1: buscar -->
    <text x="670" y="84" fill="#8b949e" font-size="13">BUSCAR</text>
    <rect x="670" y="96" width="250" height="96" rx="8" fill="#161b22" stroke="#e3b341" stroke-width="2"/>
    <text x="690" y="126" fill="#e3b341" font-size="15" font-weight="600">3. Revisión manual</text>
    <text x="690" y="150" fill="#f0f6fc" font-size="13">Cada función externa,</text>
    <text x="690" y="172" fill="#f0f6fc" font-size="13">cada clase de fallo</text>

    <line x1="605" y1="144" x2="666" y2="144" stroke="#58a6ff" stroke-width="2" marker-end="url(#a)"/>

    <rect x="670" y="250" width="250" height="96" rx="8" fill="#161b22" stroke="#e3b341" stroke-width="2"/>
    <text x="690" y="280" fill="#e3b341" font-size="15" font-weight="600">4. Herramientas</text>
    <text x="690" y="304" fill="#f0f6fc" font-size="13">Slither, invariantes, Halmos</text>
    <text x="690" y="326" fill="#8b949e" font-size="13">Confirman o abren pistas</text>

    <line x1="780" y1="192" x2="780" y2="246" stroke="#58a6ff" stroke-width="2" marker-end="url(#a)"/>
    <line x1="810" y1="246" x2="810" y2="196" stroke="#58a6ff" stroke-width="2" marker-end="url(#a)"/>

    <!-- Fila 2: contar -->
    <text x="40" y="238" fill="#8b949e" font-size="13">CONTAR</text>
    <rect x="355" y="250" width="250" height="96" rx="8" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
    <text x="375" y="280" fill="#3fb950" font-size="15" font-weight="600">5. Hallazgos</text>
    <text x="375" y="304" fill="#f0f6fc" font-size="13">Severidad y PoC</text>
    <text x="375" y="326" fill="#8b949e" font-size="13">Un test que lo demuestra</text>

    <line x1="670" y1="298" x2="609" y2="298" stroke="#58a6ff" stroke-width="2" marker-end="url(#a)"/>

    <rect x="40" y="250" width="250" height="96" rx="8" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
    <text x="60" y="280" fill="#3fb950" font-size="15" font-weight="600">6. Informe</text>
    <text x="60" y="304" fill="#f0f6fc" font-size="13">Resumen, alcance, hallazgos</text>
    <text x="60" y="326" fill="#8b949e" font-size="13">y lo que no se revisó</text>

    <line x1="355" y1="298" x2="294" y2="298" stroke="#58a6ff" stroke-width="2" marker-end="url(#a)"/>

    <!-- Revisión de correcciones -->
    <rect x="40" y="368" width="565" height="40" rx="8" fill="#161b22" stroke="#30363d" stroke-width="2"/>
    <text x="60" y="393" fill="#f0f6fc" font-size="14"><tspan font-weight="600">7. Revisión de correcciones:</tspan> compruebas cada cambio del equipo</text>
    <line x1="165" y1="346" x2="165" y2="364" stroke="#58a6ff" stroke-width="2" marker-end="url(#a)"/>
    <path d="M605 388 H640 V330 H609" fill="none" stroke="#f85149" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#r)"/>
    <text x="650" y="392" fill="#f85149" font-size="13">Corrección mala o fallo nuevo: otro hallazgo</text>
  </g>
</svg>
