# ¿Qué? Configuración de Foundry de un ejercicio o proyecto del bootcamp.
# ¿Para qué? Fijar compilador y bibliotecas para que el resultado sea idéntico en cualquier contenedor.
[profile.default]
src = "src"
test = "test"
out = "out"
# ¿Qué? forge-std y, desde la semana 11, OpenZeppelin viven en la imagen (/opt/lib), no dentro del proyecto.
libs = ["/opt/lib"]
remappings = [
    "forge-std/=/opt/lib/forge-std/src/",
    "@openzeppelin/contracts/=/opt/lib/openzeppelin-contracts/contracts/",
]
solc_version = "0.8.38"
# ¿Qué? Sin red: solc ya está en la imagen.
# ¿Impacto? Un número de versión mal escrito falla al instante en vez de intentar descargar.
offline = true
# ¿Qué? Sin los warnings de solc de las estructuras de datos de OpenZeppelin, desde la semana 31.
# ¿Para qué? solc 0.8.38 avisa de que `at` será una palabra reservada, y Checkpoints y
#   DoubleEndedQueue de OpenZeppelin 5.7, que usan ERC20Votes y Governor, tienen funciones `at`.
# ¿Impacto? Solo esa carpeta: un warning de tu código sigue apareciendo.
ignored_warnings_from = ["/opt/lib/openzeppelin-contracts/contracts/utils/structs"]
