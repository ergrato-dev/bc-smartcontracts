<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" role="img" aria-label="Estados de una propuesta: Pending hasta la foto, Active durante la votación, Succeeded si hay quórum y gana el sí, Queued en el timelock y Executed tras el plazo. Defeated si no hay quórum o gana el no. Canceled si la cancela su autor en Pending o el guardián en la cola">
  <title>El ciclo de una propuesta</title>
  <rect width="760" height="400" fill="#0d1117"/>
  <rect x="15" y="95" width="120" height="50" rx="8" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
  <text x="75" y="118" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" fill="#f0f6fc">Pending</text>
  <text x="75" y="136" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#8b949e">0</text>
  <rect x="165" y="95" width="120" height="50" rx="8" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
  <text x="225" y="118" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" fill="#f0f6fc">Active</text>
  <text x="225" y="136" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#8b949e">1</text>
  <rect x="315" y="95" width="120" height="50" rx="8" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
  <text x="375" y="118" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" fill="#f0f6fc">Succeeded</text>
  <text x="375" y="136" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#8b949e">4</text>
  <rect x="465" y="95" width="120" height="50" rx="8" fill="#161b22" stroke="#e3b341" stroke-width="2"/>
  <text x="525" y="118" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" fill="#f0f6fc">Queued</text>
  <text x="525" y="136" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#8b949e">5</text>
  <rect x="615" y="95" width="120" height="50" rx="8" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
  <text x="675" y="118" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" fill="#f0f6fc">Executed</text>
  <text x="675" y="136" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#8b949e">7</text>
  <line x1="135" y1="120" x2="153.0" y2="120.0" stroke="#8b949e" stroke-width="2"/>
  <polygon points="163.0,120.0 153.0,125.0 153.0,115.0" fill="#8b949e"/>
  <text x="150.0" y="62" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#8fa4f0">votingDelay</text>
  <text x="150.0" y="80" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#8b949e">llega la foto</text>
  <line x1="285" y1="120" x2="303.0" y2="120.0" stroke="#8b949e" stroke-width="2"/>
  <polygon points="313.0,120.0 303.0,125.0 303.0,115.0" fill="#8b949e"/>
  <text x="300.0" y="62" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#8fa4f0">votingPeriod</text>
  <text x="300.0" y="80" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#8b949e">hay quórum y gana el sí</text>
  <line x1="435" y1="120" x2="453.0" y2="120.0" stroke="#8b949e" stroke-width="2"/>
  <polygon points="463.0,120.0 453.0,125.0 453.0,115.0" fill="#8b949e"/>
  <text x="450.0" y="62" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#8fa4f0">queue()</text>
  <text x="450.0" y="80" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#8b949e">al timelock</text>
  <line x1="585" y1="120" x2="603.0" y2="120.0" stroke="#8b949e" stroke-width="2"/>
  <polygon points="613.0,120.0 603.0,125.0 603.0,115.0" fill="#8b949e"/>
  <text x="600.0" y="62" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#8fa4f0">eta + execute()</text>
  <text x="600.0" y="80" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#8b949e">plazo cumplido</text>
  <rect x="315" y="215" width="120" height="50" rx="8" fill="#161b22" stroke="#f85149" stroke-width="2"/>
  <text x="375" y="238" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" fill="#f0f6fc">Defeated</text>
  <text x="375" y="256" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#8b949e">3</text>
  <line x1="225" y1="145" x2="305.9" y2="225.0" stroke="#8b949e" stroke-width="2"/>
  <polygon points="313.0,232.0 302.4,228.5 309.4,221.4" fill="#8b949e"/>
  <text x="292" y="180" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#8b949e">sin quórum,</text>
  <text x="292" y="196" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#8b949e">o no gana el sí</text>
  <rect x="240" y="315" width="120" height="50" rx="8" fill="#161b22" stroke="#f85149" stroke-width="2"/>
  <text x="300" y="338" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" fill="#f0f6fc">Canceled</text>
  <text x="300" y="356" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#8b949e">2</text>
  <line x1="75" y1="145" x2="231.5" y2="327.4" stroke="#8b949e" stroke-width="2"/>
  <polygon points="238.0,335.0 227.7,330.7 235.3,324.2" fill="#8b949e"/>
  <text x="40" y="290" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#8b949e">cancel() de quien</text>
  <text x="40" y="306" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#8b949e">la propuso</text>
  <line x1="525" y1="145" x2="368.5" y2="327.4" stroke="#8b949e" stroke-width="2"/>
  <polygon points="362.0,335.0 364.7,324.2 372.3,330.7" fill="#8b949e"/>
  <text x="470" y="290" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#8b949e">cancel() en el timelock:</text>
  <text x="470" y="306" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#8b949e">el guardián o el Governor</text>
</svg>
