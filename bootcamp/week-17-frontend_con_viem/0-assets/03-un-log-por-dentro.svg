<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" role="img" aria-label="Un log del evento Transfer(address indexed from, address indexed to, uint256 value). address es el contrato que lo emitió. topics[0] es keccak256 de la firma Transfer(address,address,uint256), 0xddf252ad y siguiente. topics[1] es from y topics[2] es to, cada uno rellenado a 32 bytes: son los campos indexed y el nodo puede filtrar por ellos. data lleva value codificado en ABI, 0x4563918244f40000, que son 5 por 10 elevado a 18; no se puede filtrar por data, hay que traer el log y decodificarlo.">
  <title>Un log por dentro</title>
  <rect width="900" height="380" fill="#0d1117"/>
  <g font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif">
    <text x="450" y="34" font-size="19" font-weight="700" fill="#f0f6fc" text-anchor="middle">El log de un Transfer: qué va en topics y qué en data</text>
    <text x="450" y="62" font-size="13" fill="#8fa4f0" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">event Transfer(address indexed from, address indexed to, uint256 value)</text>

    <rect x="30" y="84" width="840" height="44" rx="8" fill="#161b22" stroke="#627eea" stroke-width="2"/>
    <text x="50" y="111" font-size="14" font-weight="700" fill="#f0f6fc">address</text>
    <text x="190" y="111" font-size="13" fill="#8b949e">el contrato que lo emitió: filtra siempre por él</text>

    <rect x="30" y="142" width="840" height="140" rx="8" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
    <text x="50" y="168" font-size="14" font-weight="700" fill="#f0f6fc">topics</text>
    <text x="190" y="168" font-size="13" fill="#58a6ff">indexados por el nodo: se puede filtrar por ellos</text>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">
      <text x="50" y="198" fill="#8b949e">[0]</text>
      <text x="90" y="198" fill="#f0883e">0xddf252ad1be2c89b…f523b3ef</text>
      <text x="520" y="198" fill="#8b949e" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif">keccak256("Transfer(address,address,uint256)")</text>
      <text x="50" y="228" fill="#8b949e">[1]</text>
      <text x="90" y="228" fill="#f0883e">0x000…0003c44cdddb6a900fa…93bc</text>
      <text x="520" y="228" fill="#8b949e" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif">from, rellenado a 32 bytes</text>
      <text x="50" y="258" fill="#8b949e">[2]</text>
      <text x="90" y="258" fill="#f0883e">0x000…0009965507d1a55bcc2…a4dc</text>
      <text x="520" y="258" fill="#8b949e" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif">to, rellenado a 32 bytes</text>
    </g>

    <rect x="30" y="296" width="840" height="64" rx="8" fill="#161b22" stroke="#e3b341" stroke-width="2"/>
    <text x="50" y="322" font-size="14" font-weight="700" fill="#f0f6fc">data</text>
    <text x="110" y="322" font-size="12" fill="#f0883e" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">0x000…0004563918244f40000</text>
    <text x="520" y="322" font-size="13" fill="#8b949e">value = 5·10¹⁸, codificado en ABI</text>
    <text x="50" y="346" font-size="13" fill="#e3b341">no se filtra: se trae el log y se decodifica con la ABI</text>
  </g>
</svg>
