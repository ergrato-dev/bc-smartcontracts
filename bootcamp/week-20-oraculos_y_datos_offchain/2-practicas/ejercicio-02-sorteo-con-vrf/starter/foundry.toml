# ¿Qué? Configuración de Foundry de un ejercicio o proyecto del bootcamp.
# ¿Para qué? Fijar compilador y bibliotecas para que el resultado sea idéntico en cualquier contenedor.
[profile.default]
src = "src"
test = "test"
out = "out"
# ¿Qué? forge-std, OpenZeppelin y, desde la semana 20, Chainlink viven en la imagen (/opt/lib).
libs = ["/opt/lib"]
remappings = [
    "forge-std/=/opt/lib/forge-std/src/",
    "@openzeppelin/contracts/=/opt/lib/openzeppelin-contracts/contracts/",
    "@chainlink/contracts/=/opt/lib/chainlink-contracts/",
]
solc_version = "0.8.38"
# ¿Qué? Sin red: solc ya está en la imagen.
# ¿Impacto? Un número de versión mal escrito falla al instante en vez de intentar descargar.
offline = true
# ¿Qué? No mostrar los warnings de los contratos de Chainlink.
# ¿Para qué? Su copia de OpenZeppelin 4.7 llama `at` a una función, y solc 0.8.38 avisa de que
#   será palabra reservada. Es código de la biblioteca, no tuyo: `--deny warnings` sigue
#   vigilando el tuyo.
ignored_warnings_from = ["/opt/lib/chainlink-contracts"]
