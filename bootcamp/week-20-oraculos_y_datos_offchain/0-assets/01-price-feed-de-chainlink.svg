<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" role="img" aria-label="Camino de un precio de Chainlink: varias fuentes de mercado fuera de la cadena, cinco nodos que firman, un informe en una transacción, el agregador que guarda la mediana como ronda, el proxy y tu contrato que llama a latestRoundData">
  <title>Camino de un price feed de Chainlink</title>
  <rect width="960" height="460" fill="#0d1117"/>
  <g font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif">
    <!-- Zonas -->
    <rect x="20" y="20" width="430" height="420" rx="10" fill="none" stroke="#30363d" stroke-dasharray="6 6"/>
    <text x="36" y="46" font-size="15" fill="#8b949e">Fuera de la cadena</text>
    <rect x="480" y="20" width="460" height="420" rx="10" fill="none" stroke="#627eea" stroke-dasharray="6 6"/>
    <text x="496" y="46" font-size="15" fill="#8fa4f0">En la cadena (estado de todos los nodos)</text>

    <!-- Fuentes -->
    <g font-size="13" fill="#f0f6fc" text-anchor="middle">
      <rect x="40" y="80" width="120" height="40" rx="6" fill="#161b22" stroke="#30363d"/>
      <text x="100" y="105">Fuente A</text>
      <rect x="40" y="200" width="120" height="40" rx="6" fill="#161b22" stroke="#30363d"/>
      <text x="100" y="225">Fuente B</text>
      <rect x="40" y="320" width="120" height="40" rx="6" fill="#161b22" stroke="#30363d"/>
      <text x="100" y="345">Fuente C</text>
    </g>
    <text x="100" y="390" font-size="12" fill="#8b949e" text-anchor="middle">precios de mercado</text>

    <!-- Nodos -->
    <g font-size="13" text-anchor="middle">
      <circle cx="300" cy="90" r="22" fill="#161b22" stroke="#58a6ff"/><text x="300" y="95" fill="#f0f6fc">1720</text>
      <circle cx="300" cy="155" r="22" fill="#161b22" stroke="#58a6ff"/><text x="300" y="160" fill="#f0f6fc">1721</text>
      <circle cx="300" cy="220" r="22" fill="#161b22" stroke="#58a6ff"/><text x="300" y="225" fill="#f0f6fc">1720</text>
      <circle cx="300" cy="285" r="22" fill="#161b22" stroke="#f85149"/><text x="300" y="290" fill="#f85149">9999</text>
      <circle cx="300" cy="350" r="22" fill="#161b22" stroke="#58a6ff"/><text x="300" y="355" fill="#f0f6fc">1719</text>
    </g>
    <text x="300" y="400" font-size="12" fill="#8b949e" text-anchor="middle">nodos: cada uno firma</text>
    <text x="300" y="418" font-size="12" fill="#f85149" text-anchor="middle">uno miente</text>

    <g stroke="#30363d" stroke-width="1.5">
      <line x1="160" y1="100" x2="278" y2="90"/><line x1="160" y1="100" x2="278" y2="155"/>
      <line x1="160" y1="220" x2="278" y2="220"/><line x1="160" y1="220" x2="278" y2="285"/>
      <line x1="160" y1="340" x2="278" y2="350"/><line x1="160" y1="340" x2="278" y2="155"/>
    </g>

    <!-- Informe -->
    <g stroke="#58a6ff" stroke-width="2" fill="none">
      <path d="M322 90 L380 220"/><path d="M322 155 L380 220"/><path d="M322 220 L380 220"/>
      <path d="M322 285 L380 220"/><path d="M322 350 L380 220"/>
      <path d="M380 220 L522 220"/>
      <path d="M512 214 L522 220 L512 226"/>
    </g>
    <text x="440" y="208" font-size="12" fill="#58a6ff" text-anchor="middle">1 transacción</text>
    <text x="440" y="240" font-size="12" fill="#58a6ff" text-anchor="middle">con 5 firmas</text>

    <!-- Agregador -->
    <rect x="526" y="160" width="190" height="120" rx="8" fill="#161b22" stroke="#627eea" stroke-width="2"/>
    <text x="621" y="186" font-size="15" fill="#f0f6fc" text-anchor="middle">Agregador</text>
    <text x="621" y="210" font-size="12" fill="#8b949e" text-anchor="middle">comprueba firmas</text>
    <text x="621" y="230" font-size="12" fill="#8b949e" text-anchor="middle">guarda la mediana</text>
    <text x="621" y="258" font-size="13" fill="#3fb950" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">ronda: 1720</text>

    <!-- Proxy -->
    <rect x="760" y="80" width="160" height="70" rx="8" fill="#161b22" stroke="#627eea"/>
    <text x="840" y="108" font-size="15" fill="#f0f6fc" text-anchor="middle">Proxy</text>
    <text x="840" y="130" font-size="12" fill="#8b949e" text-anchor="middle">dirección fija</text>
    <path d="M760 130 L716 180" stroke="#8fa4f0" stroke-width="2" fill="none"/>
    <path d="M719 170 L716 180 L726 176" stroke="#8fa4f0" stroke-width="2" fill="none"/>
    <text x="700" y="140" font-size="12" fill="#8fa4f0" text-anchor="end">reenvía</text>

    <!-- Tu contrato -->
    <rect x="760" y="300" width="160" height="80" rx="8" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
    <text x="840" y="330" font-size="15" fill="#f0f6fc" text-anchor="middle">Tu contrato</text>
    <text x="840" y="356" font-size="12" fill="#8b949e" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">latestRoundData()</text>
    <path d="M840 300 L840 150" stroke="#3fb950" stroke-width="2" fill="none"/>
    <path d="M834 160 L840 150 L846 160" stroke="#3fb950" stroke-width="2" fill="none"/>
    <text x="852" y="230" font-size="12" fill="#3fb950">llamada view</text>
  </g>
</svg>
