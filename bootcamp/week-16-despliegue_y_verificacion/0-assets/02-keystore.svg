<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-label="Cómo se abre un keystore. La contraseña y la sal del archivo entran en scrypt, que es lento a propósito, y salen 32 bytes. Los 16 primeros son la clave de AES-128-CTR, que con el iv descifra el ciphertext y da la clave privada. Los 16 últimos, junto con el ciphertext, pasan por keccak256 y se comparan con el campo mac del archivo. Si no coinciden, la contraseña es otra y cast responde Mac Mismatch sin descifrar nada. El archivo nunca contiene la clave privada en claro.">
  <title>Cómo se abre un keystore</title>
  <rect width="900" height="400" fill="#0d1117"/>
  <defs>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#58a6ff"/>
    </marker>
  </defs>
  <g font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif">
    <text x="450" y="34" font-size="19" font-weight="700" fill="#f0f6fc" text-anchor="middle">Un keystore guarda la clave cifrada; la contraseña la abre</text>

    <rect x="30" y="80" width="150" height="50" rx="8" fill="#161b22" stroke="#e3b341"/>
    <text x="105" y="102" font-size="14" fill="#f0f6fc" text-anchor="middle">Contraseña</text>
    <text x="105" y="120" font-size="12" fill="#8b949e" text-anchor="middle">la escribes tú</text>
    <rect x="30" y="150" width="150" height="50" rx="8" fill="#161b22" stroke="#30363d"/>
    <text x="105" y="172" font-size="14" fill="#f0f6fc" text-anchor="middle">salt</text>
    <text x="105" y="190" font-size="12" fill="#8b949e" text-anchor="middle">del archivo</text>

    <line x1="180" y1="105" x2="246" y2="135" stroke="#58a6ff" stroke-width="2" marker-end="url(#b)"/>
    <line x1="180" y1="175" x2="246" y2="148" stroke="#58a6ff" stroke-width="2" marker-end="url(#b)"/>

    <rect x="250" y="105" width="150" height="70" rx="8" fill="#161b22" stroke="#627eea" stroke-width="2"/>
    <text x="325" y="134" font-size="15" font-weight="700" fill="#f0f6fc" text-anchor="middle">scrypt</text>
    <text x="325" y="155" font-size="12" fill="#8b949e" text-anchor="middle">lento a propósito</text>

    <line x1="400" y1="140" x2="446" y2="140" stroke="#58a6ff" stroke-width="2" marker-end="url(#b)"/>

    <rect x="450" y="110" width="160" height="60" rx="8" fill="#161b22" stroke="#30363d"/>
    <text x="530" y="134" font-size="13" fill="#f0f6fc" text-anchor="middle">32 bytes derivados</text>
    <text x="490" y="156" font-size="12" fill="#f0883e" text-anchor="middle">16 primeros</text>
    <text x="572" y="156" font-size="12" fill="#e3b341" text-anchor="middle">16 últimos</text>

    <line x1="490" y1="170" x2="490" y2="236" stroke="#58a6ff" stroke-width="2" marker-end="url(#b)"/>
    <line x1="572" y1="110" x2="660" y2="92" stroke="#58a6ff" stroke-width="2" marker-end="url(#b)"/>

    <rect x="664" y="62" width="206" height="70" rx="8" fill="#161b22" stroke="#e3b341"/>
    <text x="767" y="88" font-size="13" fill="#f0f6fc" text-anchor="middle">keccak256(16 últimos +</text>
    <text x="767" y="106" font-size="13" fill="#f0f6fc" text-anchor="middle">ciphertext) == mac?</text>
    <text x="767" y="124" font-size="12" fill="#f85149" text-anchor="middle">si no: Mac Mismatch</text>

    <rect x="400" y="240" width="200" height="70" rx="8" fill="#161b22" stroke="#f0883e" stroke-width="2"/>
    <text x="500" y="266" font-size="15" font-weight="700" fill="#f0f6fc" text-anchor="middle">AES-128-CTR</text>
    <text x="500" y="288" font-size="12" fill="#8b949e" text-anchor="middle">descifra ciphertext con iv</text>

    <rect x="30" y="240" width="300" height="110" rx="8" fill="#161b22" stroke="#30363d"/>
    <text x="180" y="264" font-size="13" font-weight="700" fill="#f0f6fc" text-anchor="middle">El archivo (~/.foundry/keystores/dev)</text>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#8b949e">
      <text x="48" y="288">"kdf": "scrypt", "salt": …</text>
      <text x="48" y="308">"cipher": "aes-128-ctr", "iv": …</text>
      <text x="48" y="328">"ciphertext": …, "mac": …</text>
    </g>
    <line x1="330" y1="275" x2="396" y2="275" stroke="#58a6ff" stroke-width="2" marker-end="url(#b)"/>

    <line x1="600" y1="275" x2="666" y2="275" stroke="#58a6ff" stroke-width="2" marker-end="url(#b)"/>
    <rect x="670" y="240" width="200" height="70" rx="8" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
    <text x="770" y="266" font-size="15" font-weight="700" fill="#f0f6fc" text-anchor="middle">Clave privada</text>
    <text x="770" y="288" font-size="12" fill="#8b949e" text-anchor="middle">solo en memoria, al firmar</text>

    <text x="450" y="380" font-size="13" fill="#8b949e" text-anchor="middle">Quien copia el archivo sin la contraseña tiene que probar contraseñas una a una, y cada intento pasa por scrypt.</text>
  </g>
</svg>
