<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img" aria-label="El archivo Counter.sol entra en el compilador solc, que forge build ejecuta. Salen dos piezas: el bytecode y la ABI. El bytecode viaja en el campo input de la transacción de despliegue que envía forge create, y su código desplegado queda en la cuenta del contrato en anvil. La ABI no va a la cadena: la usan cast y los tests para construir las llamadas con selectores y para leer las respuestas.">
  <title>De Solidity a la cadena</title>
  <rect width="900" height="360" fill="#0d1117"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#58a6ff"/></marker>
    <marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#f0883e"/></marker>
  </defs>
  <g font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif">
    <rect x="20" y="130" width="150" height="90" rx="8" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
    <text x="95" y="165" font-size="16" font-weight="700" fill="#f0f6fc" text-anchor="middle">Counter.sol</text>
    <text x="95" y="190" font-size="13" fill="#8b949e" text-anchor="middle">código fuente</text>

    <line x1="170" y1="175" x2="225" y2="175" stroke="#58a6ff" stroke-width="2" marker-end="url(#a)"/>

    <rect x="230" y="130" width="150" height="90" rx="8" fill="#161b22" stroke="#627eea" stroke-width="2"/>
    <text x="305" y="165" font-size="16" font-weight="700" fill="#f0f6fc" text-anchor="middle">solc</text>
    <text x="305" y="190" font-size="13" fill="#8b949e" text-anchor="middle">vía forge build</text>

    <line x1="380" y1="155" x2="445" y2="95" stroke="#f0883e" stroke-width="2" marker-end="url(#o)"/>
    <line x1="380" y1="195" x2="445" y2="255" stroke="#58a6ff" stroke-width="2" marker-end="url(#a)"/>

    <rect x="450" y="50" width="170" height="90" rx="8" fill="#161b22" stroke="#f0883e" stroke-width="2"/>
    <text x="535" y="82" font-size="16" font-weight="700" fill="#f0f6fc" text-anchor="middle">Bytecode</text>
    <text x="535" y="106" font-size="13" fill="#8b949e" text-anchor="middle">lo que ejecuta la EVM</text>
    <text x="535" y="126" font-size="12" fill="#f0883e" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">0x60806040...</text>

    <rect x="450" y="210" width="170" height="90" rx="8" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
    <text x="535" y="242" font-size="16" font-weight="700" fill="#f0f6fc" text-anchor="middle">ABI</text>
    <text x="535" y="266" font-size="13" fill="#8b949e" text-anchor="middle">funciones y tipos</text>
    <text x="535" y="286" font-size="12" fill="#58a6ff" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">get() → 0x6d4ce63c</text>

    <line x1="620" y1="95" x2="695" y2="95" stroke="#f0883e" stroke-width="2" marker-end="url(#o)"/>
    <text x="657" y="85" font-size="12" fill="#8b949e" text-anchor="middle">forge create</text>

    <rect x="700" y="40" width="180" height="110" rx="8" fill="#161b22" stroke="#627eea" stroke-width="2"/>
    <text x="790" y="72" font-size="16" font-weight="700" fill="#f0f6fc" text-anchor="middle">Cuenta del contrato</text>
    <text x="790" y="96" font-size="13" fill="#8b949e" text-anchor="middle">en anvil</text>
    <text x="790" y="118" font-size="13" fill="#8b949e" text-anchor="middle">código desplegado</text>
    <text x="790" y="136" font-size="13" fill="#8b949e" text-anchor="middle">+ storage</text>

    <line x1="620" y1="255" x2="695" y2="255" stroke="#58a6ff" stroke-width="2" marker-end="url(#a)"/>

    <rect x="700" y="210" width="180" height="90" rx="8" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
    <text x="790" y="242" font-size="16" font-weight="700" fill="#f0f6fc" text-anchor="middle">cast y los tests</text>
    <text x="790" y="266" font-size="13" fill="#8b949e" text-anchor="middle">arman las llamadas</text>
    <text x="790" y="286" font-size="13" fill="#8b949e" text-anchor="middle">y leen respuestas</text>

    <line x1="790" y1="210" x2="790" y2="155" stroke="#58a6ff" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a)"/>
    <text x="800" y="187" font-size="12" fill="#8b949e">llaman</text>

    <text x="450" y="335" font-size="13" fill="#8b949e" text-anchor="middle">La ABI no va a la cadena: la necesita quien llama, no el contrato.</text>
  </g>
</svg>
