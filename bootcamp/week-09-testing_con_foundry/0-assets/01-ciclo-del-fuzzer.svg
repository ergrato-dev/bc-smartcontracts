<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" role="img" aria-label="Ciclo del fuzzer de forge. 1: genera una entrada mezclando valores aleatorios, bordes del tipo (0, 1, máximo) y constantes del código. 2: ejecuta el test con ella. 3: si no revierte y aún no van 256 entradas, vuelve al paso 1; con 256 entradas que pasan, el test pasa. Si revierte, guarda la entrada en cache/fuzz/failures y la informa como contraejemplo: el test falla. En la siguiente ejecución, la entrada guardada se prueba primero.">
  <title>Ciclo del fuzzer de forge</title>
  <rect width="900" height="440" fill="#0d1117"/>
  <defs>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#8b949e"/>
    </marker>
    <marker id="gr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#3fb950"/>
    </marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#f85149"/>
    </marker>
    <marker id="y" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#e3b341"/>
    </marker>
  </defs>
  <g font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif">
    <text x="450" y="34" font-size="19" font-weight="700" fill="#f0f6fc" text-anchor="middle">Qué hace forge con un testFuzz_</text>

    <rect x="30" y="70" width="240" height="120" rx="10" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
    <text x="150" y="98" font-size="16" font-weight="700" fill="#f0f6fc" text-anchor="middle">1. Genera una entrada</text>
    <text x="150" y="124" font-size="13" fill="#8b949e" text-anchor="middle">valores aleatorios</text>
    <text x="150" y="144" font-size="13" fill="#8b949e" text-anchor="middle">bordes del tipo: 0, 1, máximo</text>
    <text x="150" y="164" font-size="13" fill="#8b949e" text-anchor="middle">constantes de tu código</text>

    <rect x="330" y="70" width="240" height="120" rx="10" fill="#161b22" stroke="#627eea" stroke-width="2"/>
    <text x="450" y="112" font-size="16" font-weight="700" fill="#f0f6fc" text-anchor="middle">2. Ejecuta el test</text>
    <text x="450" y="138" font-size="13" fill="#8b949e" text-anchor="middle">setUp() y después</text>
    <text x="450" y="158" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#8fa4f0" text-anchor="middle">testFuzz_X(entrada)</text>

    <rect x="630" y="90" width="240" height="80" rx="10" fill="#161b22" stroke="#30363d"/>
    <text x="750" y="126" font-size="16" font-weight="700" fill="#f0f6fc" text-anchor="middle">3. ¿Revierte?</text>
    <text x="750" y="150" font-size="13" fill="#8b949e" text-anchor="middle">un assert falso también revierte</text>

    <g stroke-width="2" fill="none">
      <path d="M272 130 L326 130" stroke="#8b949e" marker-end="url(#g)"/>
      <path d="M572 130 L626 130" stroke="#8b949e" marker-end="url(#g)"/>
      <path d="M690 172 L690 232 L500 232" stroke="#3fb950" marker-end="url(#gr)"/>
      <path d="M810 172 L810 262" stroke="#f85149" marker-end="url(#r)"/>
    </g>
    <text x="700" y="210" font-size="14" font-weight="700" fill="#3fb950">no</text>
    <text x="820" y="210" font-size="14" font-weight="700" fill="#f85149">sí</text>

    <rect x="290" y="212" width="208" height="64" rx="10" fill="#161b22" stroke="#30363d"/>
    <text x="394" y="240" font-size="15" font-weight="700" fill="#f0f6fc" text-anchor="middle">¿Van 256 entradas?</text>
    <text x="394" y="262" font-size="13" fill="#8b949e" text-anchor="middle">o las runs que configures</text>
    <path d="M290 244 L150 244 L150 194" stroke="#8b949e" stroke-width="2" fill="none" marker-end="url(#g)"/>
    <text x="220" y="236" font-size="14" font-weight="700" fill="#8b949e" text-anchor="middle">no: otra</text>
    <path d="M394 278 L394 318" stroke="#3fb950" stroke-width="2" fill="none" marker-end="url(#gr)"/>
    <text x="404" y="302" font-size="14" font-weight="700" fill="#3fb950">sí</text>

    <rect x="290" y="322" width="208" height="70" rx="10" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
    <text x="394" y="352" font-size="16" font-weight="700" fill="#3fb950" text-anchor="middle">PASS</text>
    <text x="394" y="376" font-size="13" fill="#8b949e" text-anchor="middle">ninguna entrada falló</text>

    <rect x="640" y="266" width="230" height="56" rx="10" fill="#161b22" stroke="#e3b341" stroke-width="2"/>
    <text x="755" y="290" font-size="14" font-weight="700" fill="#f0f6fc" text-anchor="middle">Guarda la entrada en</text>
    <text x="755" y="310" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#e3b341" text-anchor="middle">cache/fuzz/failures</text>
    <path d="M755 324 L755 340" stroke="#f85149" stroke-width="2" fill="none" marker-end="url(#r)"/>

    <rect x="640" y="344" width="230" height="56" rx="10" fill="#161b22" stroke="#f85149" stroke-width="2"/>
    <text x="755" y="368" font-size="16" font-weight="700" fill="#f85149" text-anchor="middle">FAIL</text>
    <text x="755" y="388" font-size="13" fill="#8b949e" text-anchor="middle">con el contraejemplo: args=[…]</text>

    <path d="M638 294 L540 294 L540 424 L60 424 L60 194" stroke="#e3b341" stroke-width="2" stroke-dasharray="6 5" fill="none" marker-end="url(#y)"/>
    <text x="300" y="414" font-size="13" fill="#e3b341" text-anchor="middle">siguiente ejecución: la prueba primero</text>
  </g>
</svg>
