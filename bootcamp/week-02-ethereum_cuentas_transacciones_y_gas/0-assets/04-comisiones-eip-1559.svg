<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" role="img" aria-label="Desglose del precio del gas según EIP-1559 con el ejemplo de la teoría. Una barra de 5 gwei representa el tope maxFeePerGas. Dentro, 1 gwei de base fee, que se quema, y 2 gwei de propina, que van a quien construye el bloque; suman el precio efectivo de 3 gwei. Los 2 gwei restantes hasta el tope no se cobran. El costo es 21000 de gas usado por 3 gwei, 63000 gwei: 21000 gwei quemados y 42000 gwei de propina.">
  <title>Qué paga una transacción (EIP-1559)</title>
  <rect width="880" height="340" fill="#0d1117"/>
  <g font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif">
    <text x="20" y="34" font-size="16" font-weight="700" fill="#f0f6fc">Precio por unidad de gas: tope 5 gwei, propina 2 gwei, base fee 1 gwei</text>
    <rect x="40" y="70" width="800" height="60" rx="6" fill="#161b22" stroke="#30363d" stroke-width="2" stroke-dasharray="6 4"/>
    <rect x="40" y="70" width="160" height="60" fill="#161b22" stroke="#f85149" stroke-width="2"/>
    <rect x="200" y="70" width="320" height="60" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
    <g font-size="14" fill="#f0f6fc" text-anchor="middle">
      <text x="120" y="98">base fee</text><text x="360" y="98">propina</text><text x="680" y="98" fill="#8b949e">no se cobra</text>
    </g>
    <g font-size="13" fill="#8b949e" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
      <text x="120" y="118">1 gwei</text><text x="360" y="118">2 gwei</text><text x="680" y="118">2 gwei</text>
    </g>
    <g stroke="#8b949e" stroke-width="1.5">
      <line x1="40" y1="146" x2="520" y2="146"/><line x1="40" y1="140" x2="40" y2="152"/><line x1="520" y1="140" x2="520" y2="152"/>
      <line x1="40" y1="186" x2="840" y2="186"/><line x1="40" y1="180" x2="40" y2="192"/><line x1="840" y1="180" x2="840" y2="192"/>
    </g>
    <text x="280" y="170" font-size="13" fill="#f0f6fc" text-anchor="middle">precio efectivo = mínimo(tope, base fee + propina) = 3 gwei</text>
    <text x="440" y="210" font-size="13" fill="#8b949e" text-anchor="middle">maxFeePerGas (tope) = 5 gwei</text>

    <text x="20" y="252" font-size="16" font-weight="700" fill="#f0f6fc">Costo = gas usado × precio efectivo = 21000 × 3 gwei = 63000 gwei</text>
    <rect x="40" y="270" width="250" height="50" rx="8" fill="#161b22" stroke="#f85149" stroke-width="2"/>
    <rect x="310" y="270" width="290" height="50" rx="8" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
    <g font-size="13" fill="#f0f6fc" text-anchor="middle">
      <text x="165" y="300">21000 gwei se queman</text>
      <text x="455" y="300">42000 gwei de propina</text>
    </g>
    <text x="620" y="292" font-size="12" fill="#8b949e">para quien construye el</text>
    <text x="620" y="310" font-size="12" fill="#8b949e">bloque (en anvil, 0x0…0)</text>
  </g>
</svg>
