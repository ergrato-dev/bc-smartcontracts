<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-label="Cadena de _update. transfer, _mint y _burn llaman a _update de tu contrato, que hace su comprobación y llama a super. super pasa a ERC20Capped, que llama a su vez a super, ERC20, que mueve los saldos y emite Transfer. A la vuelta, ERC20Capped comprueba que el suministro no pasa del tope y, si lo pasa, revierte y se deshace todo.">
  <title>_update y super</title>
  <rect width="900" height="400" fill="#0d1117"/>
  <defs>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#58a6ff"/>
    </marker>
    <marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#f0883e"/>
    </marker>
  </defs>
  <g font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif">
    <text x="450" y="32" font-size="19" font-weight="700" fill="#f0f6fc" text-anchor="middle">Un solo punto de paso: _update</text>

    <rect x="40" y="60" width="200" height="40" rx="8" fill="#161b22" stroke="#30363d"/>
    <text x="140" y="85" font-size="13" fill="#f0f6fc" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">transfer · transferFrom</text>
    <rect x="40" y="110" width="200" height="40" rx="8" fill="#161b22" stroke="#30363d"/>
    <text x="140" y="135" font-size="13" fill="#f0f6fc" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">_mint · _burn</text>
    <line x1="240" y1="80" x2="316" y2="116" stroke="#58a6ff" stroke-width="2" marker-end="url(#b)"/>
    <line x1="240" y1="130" x2="316" y2="130" stroke="#58a6ff" stroke-width="2" marker-end="url(#b)"/>

    <rect x="320" y="90" width="540" height="76" rx="8" fill="#161b22" stroke="#627eea" stroke-width="2"/>
    <text x="340" y="116" font-size="15" font-weight="700" fill="#f0f6fc">Tu contrato: _update</text>
    <text x="340" y="142" font-size="13" fill="#f0f6fc" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">if (to == address(this)) revert SelfTransfer();</text>
    <text x="340" y="160" font-size="13" fill="#58a6ff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">super._update(from, to, value);</text>

    <line x1="590" y1="166" x2="590" y2="196" stroke="#58a6ff" stroke-width="2" marker-end="url(#b)"/>
    <text x="602" y="186" font-size="12" fill="#58a6ff">super</text>

    <rect x="320" y="200" width="540" height="76" rx="8" fill="#161b22" stroke="#627eea" stroke-width="2"/>
    <text x="340" y="226" font-size="15" font-weight="700" fill="#f0f6fc">ERC20Capped: _update</text>
    <text x="340" y="250" font-size="13" fill="#58a6ff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">super._update(from, to, value);</text>
    <text x="340" y="268" font-size="13" fill="#f0883e" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">if (supply &gt; cap) revert ERC20ExceededCap(...);</text>

    <line x1="590" y1="276" x2="590" y2="306" stroke="#58a6ff" stroke-width="2" marker-end="url(#b)"/>
    <text x="602" y="296" font-size="12" fill="#58a6ff">super</text>

    <rect x="320" y="310" width="540" height="60" rx="8" fill="#161b22" stroke="#627eea" stroke-width="2"/>
    <text x="340" y="336" font-size="15" font-weight="700" fill="#f0f6fc">ERC20: _update</text>
    <text x="340" y="358" font-size="13" fill="#3fb950" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">mueve saldos · emit Transfer</text>

    <path d="M320 340 C 270 340, 270 250, 316 250" fill="none" stroke="#f0883e" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#o)"/>
    <text x="40" y="290" font-size="12" fill="#f0883e">a la vuelta, el tope:</text>
    <text x="40" y="308" font-size="12" fill="#f0883e">si se pasa, se deshace todo</text>
  </g>
</svg>
