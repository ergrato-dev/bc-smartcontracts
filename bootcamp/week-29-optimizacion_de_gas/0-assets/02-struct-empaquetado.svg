<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" role="img" aria-label="Los mismos cuatro campos en dos órdenes. Loose ocupa tres slots: kind solo con 31 bytes libres, amount entero, y buyer con createdAt y 4 bytes libres; addLoose gasta 88 946. Tight ocupa dos: buyer, createdAt y kind juntos con 3 bytes libres, y amount; addTight gasta 67 074. El offset 0 de cada slot está a la derecha.">
  <title>Un struct empaquetado ocupa un slot menos</title>
  <rect width="960" height="460" fill="#0d1117"/>
  <g font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif">
    <text x="480" y="36" fill="#f0f6fc" font-size="20" font-weight="600" text-anchor="middle">Los mismos campos, en otro orden</text>
    <text x="880" y="62" fill="#8b949e" font-size="13" text-anchor="end">offset 0 →</text>

    <text x="60" y="88" fill="#f85149" font-size="16" font-weight="600">Loose: 3 slots, addLoose 88 946</text>
    <g font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
      <text x="60" y="124" fill="#8b949e">+0</text>
      <rect x="120" y="102" width="740" height="34" rx="4" fill="#0d1117" stroke="#30363d" stroke-dasharray="4 4"/>
      <text x="480" y="124" fill="#8b949e" text-anchor="middle">31 bytes libres</text>
      <rect x="860" y="102" width="23" height="34" rx="4" fill="#161b22" stroke="#f0883e"/>
      <text x="871" y="156" fill="#f0883e" text-anchor="middle">kind</text>

      <text x="60" y="190" fill="#8b949e">+1</text>
      <rect x="120" y="168" width="763" height="34" rx="4" fill="#161b22" stroke="#627eea"/>
      <text x="501" y="190" fill="#8fa4f0" text-anchor="middle">amount (32 bytes)</text>

      <text x="60" y="236" fill="#8b949e">+2</text>
      <rect x="120" y="214" width="92" height="34" rx="4" fill="#0d1117" stroke="#30363d" stroke-dasharray="4 4"/>
      <rect x="212" y="214" width="194" height="34" rx="4" fill="#161b22" stroke="#e3b341"/>
      <text x="309" y="236" fill="#e3b341" text-anchor="middle">createdAt (8)</text>
      <rect x="406" y="214" width="477" height="34" rx="4" fill="#161b22" stroke="#58a6ff"/>
      <text x="644" y="236" fill="#58a6ff" text-anchor="middle">buyer (20)</text>
    </g>

    <text x="60" y="300" fill="#3fb950" font-size="16" font-weight="600">Tight: 2 slots, addTight 67 074</text>
    <g font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
      <text x="60" y="336" fill="#8b949e">+0</text>
      <rect x="120" y="314" width="69" height="34" rx="4" fill="#0d1117" stroke="#30363d" stroke-dasharray="4 4"/>
      <rect x="189" y="314" width="23" height="34" rx="4" fill="#161b22" stroke="#f0883e"/>
      <text x="200" y="368" fill="#f0883e" text-anchor="middle">kind</text>
      <rect x="212" y="314" width="194" height="34" rx="4" fill="#161b22" stroke="#e3b341"/>
      <text x="309" y="336" fill="#e3b341" text-anchor="middle">createdAt (8)</text>
      <rect x="406" y="314" width="477" height="34" rx="4" fill="#161b22" stroke="#58a6ff"/>
      <text x="644" y="336" fill="#58a6ff" text-anchor="middle">buyer (20)</text>

      <text x="60" y="404" fill="#8b949e">+1</text>
      <rect x="120" y="382" width="763" height="34" rx="4" fill="#161b22" stroke="#627eea"/>
      <text x="501" y="404" fill="#8fa4f0" text-anchor="middle">amount (32 bytes)</text>
    </g>
    <text x="480" y="446" fill="#8b949e" font-size="13" text-anchor="middle">Un slot nuevo menos: un SSTORE frío de cero a otro valor (22 100) que no se paga</text>
  </g>
</svg>
