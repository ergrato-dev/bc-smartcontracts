<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-label="Tres columnas con el storage del mismo proxy. A la izquierda, lo que escribió NotesV1: count en el slot 0 y la raíz del mapping notes en el slot 1. En el centro, NotesV2, compatible: repite count en el slot 0 y notes en el slot 1, y añade authorOf en el slot 2, que estaba vacío. A la derecha, NotesV2Bad, incompatible: pone lastAuthor en el slot 0, donde está count, count en el slot 1 y notes en el slot 2, así que cada variable lee el dato de otra. Abajo, lejos de los slots 0, 1 y 2, los slots de EIP-1967 del proxy y los de ERC-7201 de OpenZeppelin, iguales en las tres versiones.">
  <title>Layout de V1 y V2</title>
  <rect width="900" height="400" fill="#0d1117"/>
  <g font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif">
    <text x="450" y="32" font-size="19" font-weight="700" fill="#f0f6fc" text-anchor="middle">La V2 lee el storage que escribió la V1, slot a slot</text>

    <g font-size="13" fill="#f0f6fc">
      <text x="40" y="76" fill="#8b949e">slot</text>
      <text x="40" y="112">0</text>
      <text x="40" y="152">1</text>
      <text x="40" y="192">2</text>

      <text x="200" y="76" font-size="15" font-weight="700" text-anchor="middle">NotesV1 (desplegada)</text>
      <rect x="90" y="92" width="220" height="32" rx="4" fill="#161b22" stroke="#30363d"/>
      <text x="100" y="113">count = 2</text>
      <rect x="90" y="132" width="220" height="32" rx="4" fill="#161b22" stroke="#30363d"/>
      <text x="100" y="153">notes (raíz del mapping)</text>
      <rect x="90" y="172" width="220" height="32" rx="4" fill="#0d1117" stroke="#30363d" stroke-dasharray="4 4"/>
      <text x="100" y="193" fill="#8b949e">vacío</text>

      <text x="450" y="76" font-size="15" font-weight="700" text-anchor="middle" fill="#3fb950">NotesV2: compatible</text>
      <rect x="340" y="92" width="220" height="32" rx="4" fill="#161b22" stroke="#3fb950"/>
      <text x="350" y="113">count</text>
      <rect x="340" y="132" width="220" height="32" rx="4" fill="#161b22" stroke="#3fb950"/>
      <text x="350" y="153">notes</text>
      <rect x="340" y="172" width="220" height="32" rx="4" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
      <text x="350" y="193" fill="#58a6ff">authorOf (nueva, al final)</text>

      <text x="700" y="76" font-size="15" font-weight="700" text-anchor="middle" fill="#f85149">NotesV2Bad: incompatible</text>
      <rect x="590" y="92" width="220" height="32" rx="4" fill="#161b22" stroke="#f85149"/>
      <text x="600" y="113">lastAuthor → lee el 2 de count</text>
      <rect x="590" y="132" width="220" height="32" rx="4" fill="#161b22" stroke="#f85149"/>
      <text x="600" y="153">count → lee 0</text>
      <rect x="590" y="172" width="220" height="32" rx="4" fill="#161b22" stroke="#f85149"/>
      <text x="600" y="193">notes → busca en slots vacíos</text>
    </g>

    <text x="450" y="236" font-size="13" fill="#8b949e" text-anchor="middle">… muy lejos, entre 2²⁵⁶ slots …</text>

    <g font-size="13" fill="#f0f6fc">
      <rect x="90" y="256" width="720" height="32" rx="4" fill="#161b22" stroke="#e3b341"/>
      <text x="100" y="277">0x3608…bbc  implementación (EIP-1967, el proxy)</text>
      <text x="800" y="277" text-anchor="end" fill="#8b949e">igual en las tres</text>
      <rect x="90" y="296" width="720" height="32" rx="4" fill="#161b22" stroke="#e3b341"/>
      <text x="100" y="317">0x9016…9300  _owner (ERC-7201, openzeppelin.storage.Ownable)</text>
      <text x="800" y="317" text-anchor="end" fill="#8b949e">igual en las tres</text>
    </g>

    <text x="450" y="364" font-size="14" fill="#f0f6fc" text-anchor="middle">Añadir al final es compatible. Insertar, borrar o reordenar desplaza todo:</text>
    <text x="450" y="386" font-size="14" fill="#e3b341" text-anchor="middle">no revierte nada, el contrato sigue funcionando con datos falsos.</text>
  </g>
</svg>
