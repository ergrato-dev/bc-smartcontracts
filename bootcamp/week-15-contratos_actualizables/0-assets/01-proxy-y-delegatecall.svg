<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-label="La usuaria llama a increment en el proxy. El proxy no tiene esa función: su fallback la reenvía con delegatecall a la implementación. El storage del proxy guarda count en el slot 0, la dirección de la implementación en el slot de EIP-1967 terminado en bbc y el administrador en el slot terminado en 6103. Antes de actualizar, el proxy apunta a CounterV1; tras upgradeTo apunta a CounterV2, que añade decrement. La dirección del proxy y su storage no cambian: solo cambia el código que se ejecuta.">
  <title>Proxy y delegatecall</title>
  <rect width="900" height="420" fill="#0d1117"/>
  <defs>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#58a6ff"/>
    </marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#8b949e"/>
    </marker>
  </defs>
  <g font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif">
    <text x="450" y="34" font-size="19" font-weight="700" fill="#f0f6fc" text-anchor="middle">El proxy guarda el estado; la implementación, el código</text>

    <rect x="30" y="160" width="140" height="56" rx="8" fill="#161b22" stroke="#627eea"/>
    <text x="100" y="185" font-size="14" fill="#f0f6fc" text-anchor="middle">Usuaria</text>
    <text x="100" y="204" font-size="12" fill="#8b949e" text-anchor="middle">msg.sender</text>
    <line x1="170" y1="188" x2="246" y2="188" stroke="#58a6ff" stroke-width="2" marker-end="url(#b)"/>
    <text x="208" y="178" font-size="12" fill="#e3b341" text-anchor="middle">increment()</text>

    <rect x="250" y="70" width="320" height="270" rx="10" fill="#161b22" stroke="#627eea" stroke-width="2"/>
    <text x="410" y="98" font-size="16" font-weight="700" fill="#f0f6fc" text-anchor="middle">Proxy 0x9fE4…</text>
    <text x="410" y="120" font-size="12" fill="#8b949e" text-anchor="middle">no tiene increment: cae en el fallback</text>
    <rect x="270" y="134" width="280" height="34" rx="6" fill="#0d1117" stroke="#30363d"/>
    <text x="410" y="156" font-size="13" fill="#f0f6fc" text-anchor="middle">fallback → delegatecall(msg.data)</text>

    <text x="270" y="194" font-size="13" font-weight="700" fill="#f0f6fc">Storage del proxy</text>
    <g font-size="12" fill="#f0f6fc">
      <rect x="270" y="204" width="280" height="30" fill="#0d1117" stroke="#30363d"/>
      <text x="280" y="224">slot 0</text>
      <text x="540" y="224" text-anchor="end" fill="#3fb950">count = 2</text>
      <rect x="270" y="234" width="280" height="30" fill="#0d1117" stroke="#30363d"/>
      <text x="280" y="254">slot 0x3608…bbc</text>
      <text x="540" y="254" text-anchor="end" fill="#e3b341">implementación</text>
      <rect x="270" y="264" width="280" height="30" fill="#0d1117" stroke="#30363d"/>
      <text x="280" y="284">slot 0xb531…6103</text>
      <text x="540" y="284" text-anchor="end" fill="#e3b341">administrador</text>
    </g>
    <text x="410" y="322" font-size="12" fill="#8b949e" text-anchor="middle">la dirección y el storage no cambian nunca</text>

    <rect x="660" y="80" width="210" height="96" rx="8" fill="#161b22" stroke="#30363d" stroke-dasharray="6 4"/>
    <text x="765" y="106" font-size="15" font-weight="700" fill="#8b949e" text-anchor="middle">CounterV1</text>
    <text x="765" y="128" font-size="12" fill="#8b949e" text-anchor="middle">increment, version() = 1</text>
    <text x="765" y="148" font-size="12" fill="#8b949e" text-anchor="middle">solo código: su storage</text>
    <text x="765" y="164" font-size="12" fill="#8b949e" text-anchor="middle">no lo usa nadie</text>
    <path d="M570 150 L656 128" fill="none" stroke="#8b949e" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#g)"/>
    <text x="612" y="124" font-size="12" fill="#8b949e" text-anchor="middle">antes</text>

    <rect x="660" y="230" width="210" height="96" rx="8" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
    <text x="765" y="256" font-size="15" font-weight="700" fill="#f0f6fc" text-anchor="middle">CounterV2</text>
    <text x="765" y="278" font-size="12" fill="#f0f6fc" text-anchor="middle">+ decrement, version() = 2</text>
    <text x="765" y="298" font-size="12" fill="#f0f6fc" text-anchor="middle">count sigue en el slot 0</text>
    <path d="M570 250 L656 270" fill="none" stroke="#58a6ff" stroke-width="2" marker-end="url(#b)"/>
    <text x="616" y="290" font-size="12" fill="#58a6ff" text-anchor="middle">tras upgradeTo</text>

    <text x="450" y="378" font-size="14" fill="#f0f6fc" text-anchor="middle">El código de la implementación se ejecuta sobre el storage del proxy, con el msg.sender de la usuaria.</text>
    <text x="450" y="402" font-size="14" fill="#e3b341" text-anchor="middle">Actualizar = escribir otra dirección en el slot de la implementación.</text>
  </g>
</svg>
