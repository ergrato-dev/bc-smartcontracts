<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" role="img" aria-label="Del código al hallazgo: forge compila el código Solidity con solc y deja el AST; Slither lo convierte en un grafo de control por función y cada nodo en operaciones de SlithIR; más de cien detectores buscan patrones sobre esa representación y devuelven hallazgos con impacto y confianza; tú los clasificas en verdaderos, falsos positivos o aceptados. forge lint hace lo mismo dentro de forge, con sus propios lints">
  <title>Del código al hallazgo</title>
  <rect width="900" height="470" fill="#0d1117"/>
  <g font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif">
    <text x="450" y="34" fill="#f0f6fc" font-size="20" font-weight="600" text-anchor="middle">Del código al hallazgo, sin ejecutar nada</text>

    <!-- Código -->
    <rect x="30" y="70" width="150" height="110" rx="8" fill="#161b22" stroke="#8b949e" stroke-width="2"/>
    <text x="105" y="98" fill="#f0f6fc" font-size="15" font-weight="600" text-anchor="middle">Código</text>
    <text x="105" y="124" fill="#8b949e" font-size="13" text-anchor="middle">src/*.sol</text>
    <text x="105" y="146" fill="#8b949e" font-size="13" text-anchor="middle">tal cual lo</text>
    <text x="105" y="164" fill="#8b949e" font-size="13" text-anchor="middle">escribiste</text>

    <line x1="180" y1="125" x2="214" y2="125" stroke="#8b949e" stroke-width="2"/>
    <polygon points="214,119 226,125 214,131" fill="#8b949e"/>

    <!-- AST -->
    <rect x="226" y="70" width="150" height="110" rx="8" fill="#161b22" stroke="#627eea" stroke-width="2"/>
    <text x="301" y="98" fill="#8fa4f0" font-size="15" font-weight="600" text-anchor="middle">AST</text>
    <text x="301" y="124" fill="#8b949e" font-size="13" text-anchor="middle">el árbol que deja</text>
    <text x="301" y="146" fill="#8b949e" font-size="13" text-anchor="middle">solc al compilar</text>
    <text x="301" y="164" fill="#8b949e" font-size="13" text-anchor="middle">(forge build)</text>

    <line x1="376" y1="125" x2="410" y2="125" stroke="#8b949e" stroke-width="2"/>
    <polygon points="410,119 422,125 410,131" fill="#8b949e"/>

    <!-- CFG + SlithIR -->
    <rect x="422" y="70" width="190" height="110" rx="8" fill="#161b22" stroke="#627eea" stroke-width="2"/>
    <text x="517" y="98" fill="#8fa4f0" font-size="15" font-weight="600" text-anchor="middle">Grafo + SlithIR</text>
    <text x="517" y="124" fill="#8b949e" font-size="13" text-anchor="middle">un grafo de control por</text>
    <text x="517" y="146" fill="#8b949e" font-size="13" text-anchor="middle">función; cada nodo, en</text>
    <text x="517" y="164" fill="#8b949e" font-size="13" text-anchor="middle">operaciones simples</text>

    <line x1="612" y1="125" x2="646" y2="125" stroke="#8b949e" stroke-width="2"/>
    <polygon points="646,119 658,125 646,131" fill="#8b949e"/>

    <!-- Detectores -->
    <rect x="658" y="70" width="212" height="110" rx="8" fill="#161b22" stroke="#d29922" stroke-width="2"/>
    <text x="764" y="98" fill="#d29922" font-size="15" font-weight="600" text-anchor="middle">Detectores</text>
    <text x="764" y="124" fill="#8b949e" font-size="13" text-anchor="middle">101 en Slither 0.11.5</text>
    <text x="764" y="146" fill="#8b949e" font-size="13" text-anchor="middle">y los tuyos: cada uno</text>
    <text x="764" y="164" fill="#8b949e" font-size="13" text-anchor="middle">busca un patrón</text>

    <!-- forge lint -->
    <path d="M301 180 L301 222 L764 222 L764 192" fill="none" stroke="#8b949e" stroke-width="2" stroke-dasharray="6 5"/>
    <polygon points="758,192 764,180 770,192" fill="#8b949e"/>
    <text x="532" y="244" fill="#8b949e" font-size="13" text-anchor="middle">forge lint hace lo mismo dentro de forge, con sus propios lints</text>

    <line x1="764" y1="260" x2="764" y2="282" stroke="#8b949e" stroke-width="2"/>
    <polygon points="758,282 764,294 770,282" fill="#8b949e"/>

    <!-- Hallazgos -->
    <rect x="30" y="294" width="840" height="150" rx="10" fill="#161b22" stroke="#8b949e" stroke-width="2"/>
    <text x="50" y="320" fill="#f0f6fc" font-size="15" font-weight="600">Hallazgos: detector, impacto, confianza, archivo y líneas. Los clasificas tú</text>

    <rect x="50" y="338" width="250" height="88" rx="8" fill="#0d1117" stroke="#f85149" stroke-width="2"/>
    <text x="175" y="364" fill="#f85149" font-size="14" font-weight="600" text-anchor="middle">Verdadero</text>
    <text x="175" y="388" fill="#8b949e" font-size="13" text-anchor="middle">el fallo existe:</text>
    <text x="175" y="408" fill="#8b949e" font-size="13" text-anchor="middle">se corrige y se prueba</text>

    <rect x="325" y="338" width="250" height="88" rx="8" fill="#0d1117" stroke="#3fb950" stroke-width="2"/>
    <text x="450" y="364" fill="#3fb950" font-size="14" font-weight="600" text-anchor="middle">Falso positivo</text>
    <text x="450" y="388" fill="#8b949e" font-size="13" text-anchor="middle">el patrón está, el fallo no:</text>
    <text x="450" y="408" fill="#8b949e" font-size="13" text-anchor="middle">se justifica en la línea</text>

    <rect x="600" y="338" width="250" height="88" rx="8" fill="#0d1117" stroke="#d29922" stroke-width="2"/>
    <text x="725" y="364" fill="#d29922" font-size="14" font-weight="600" text-anchor="middle">Aceptado</text>
    <text x="725" y="388" fill="#8b949e" font-size="13" text-anchor="middle">el riesgo existe y se asume:</text>
    <text x="725" y="408" fill="#8b949e" font-size="13" text-anchor="middle">se justifica y se documenta</text>
  </g>
</svg>
