<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-label="Pila de llamadas de una reentrancy: EtherStore envía 1 ETH a Thief antes de poner su saldo a cero; el receive de Thief vuelve a llamar a withdraw, que todavía ve el saldo en 1 ETH; se repite tres veces hasta vaciar el contrato, y solo al final cada withdraw pone el saldo a 0">
<title>Pila de llamadas de una reentrancy</title>
<rect width="960" height="600" fill="#0d1117"/>
<g font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif">
<rect x="110" y="24" width="180" height="44" rx="8" fill="#161b22" stroke="#f85149" stroke-width="2"/>
<text x="200" y="52" font-size="15" fill="#f0f6fc" text-anchor="middle">Thief</text>
<line x1="200" y1="68" x2="200" y2="540" stroke="#30363d" stroke-width="2" stroke-dasharray="4 6"/>
<rect x="430" y="24" width="180" height="44" rx="8" fill="#161b22" stroke="#627eea" stroke-width="2"/>
<text x="520" y="52" font-size="15" fill="#f0f6fc" text-anchor="middle">EtherStore</text>
<line x1="520" y1="68" x2="520" y2="540" stroke="#30363d" stroke-width="2" stroke-dasharray="4 6"/>
<text x="680" y="44" font-size="13" fill="#8b949e">balanceOf[thief]</text>
<text x="860" y="44" font-size="13" fill="#8b949e" text-anchor="middle">saldo del banco</text>
<line x1="660" y1="60" x2="940" y2="60" stroke="#30363d"/>
<rect x="512" y="96" width="10" height="424" fill="#161b22" stroke="#627eea"/>
<rect x="520" y="196" width="10" height="294" fill="#161b22" stroke="#627eea"/>
<rect x="528" y="296" width="10" height="164" fill="#161b22" stroke="#627eea"/>
<path d="M200 100 L510 100" stroke="#58a6ff" stroke-width="2"/>
<path d="M500 94 L510 100 L500 106" stroke="#58a6ff" stroke-width="2" fill="none"/>
<text x="355.0" y="92" font-size="13" fill="#f0f6fc" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">withdraw()  #1</text>
<text x="680" y="104" font-size="13" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">1 ETH</text>
<text x="860" y="104" font-size="13" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">3 ETH</text>
<path d="M510 150 L210 150" stroke="#f0883e" stroke-width="2"/>
<path d="M220 144 L210 150 L220 156" stroke="#f0883e" stroke-width="2" fill="none"/>
<text x="360.0" y="142" font-size="13" fill="#f0f6fc" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">call{value: 1 ETH}</text>
<text x="680" y="154" font-size="13" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">1 ETH</text>
<text x="860" y="154" font-size="13" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">2 ETH</text>
<path d="M200 200 L518 200" stroke="#58a6ff" stroke-width="2"/>
<path d="M508 194 L518 200 L508 206" stroke="#58a6ff" stroke-width="2" fill="none"/>
<text x="359.0" y="192" font-size="13" fill="#f0f6fc" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">receive → withdraw()  #2</text>
<text x="680" y="204" font-size="13" fill="#e3b341" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">1 ETH  ← sin restar</text>
<text x="860" y="204" font-size="13" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">2 ETH</text>
<path d="M518 250 L210 250" stroke="#f0883e" stroke-width="2"/>
<path d="M220 244 L210 250 L220 256" stroke="#f0883e" stroke-width="2" fill="none"/>
<text x="364.0" y="242" font-size="13" fill="#f0f6fc" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">call{value: 1 ETH}</text>
<text x="680" y="254" font-size="13" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">1 ETH</text>
<text x="860" y="254" font-size="13" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">1 ETH</text>
<path d="M200 300 L526 300" stroke="#58a6ff" stroke-width="2"/>
<path d="M516 294 L526 300 L516 306" stroke="#58a6ff" stroke-width="2" fill="none"/>
<text x="363.0" y="292" font-size="13" fill="#f0f6fc" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">receive → withdraw()  #3</text>
<text x="680" y="304" font-size="13" fill="#e3b341" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">1 ETH  ← sin restar</text>
<text x="860" y="304" font-size="13" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">1 ETH</text>
<path d="M526 350 L210 350" stroke="#f0883e" stroke-width="2"/>
<path d="M220 344 L210 350 L220 356" stroke="#f0883e" stroke-width="2" fill="none"/>
<text x="368.0" y="342" font-size="13" fill="#f0f6fc" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">call{value: 1 ETH}</text>
<text x="680" y="354" font-size="13" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">1 ETH</text>
<text x="860" y="354" font-size="13" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">0 ETH</text>
<rect x="80" y="380" width="240" height="40" rx="6" fill="#161b22" stroke="#30363d"/>
<text x="200" y="405" font-size="13" fill="#8b949e" text-anchor="middle">receive: banco &lt; 1 ETH, para</text>
<text x="340" y="464" font-size="13" fill="#f85149" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">balanceOf[thief] = 0  #3</text>
<path d="M350 460 L526 460" stroke="#f85149" stroke-width="1" stroke-dasharray="3 4"/>
<text x="340" y="494" font-size="13" fill="#f85149" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">balanceOf[thief] = 0  #2</text>
<path d="M350 490 L518 490" stroke="#f85149" stroke-width="1" stroke-dasharray="3 4"/>
<text x="340" y="524" font-size="13" fill="#f85149" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">balanceOf[thief] = 0  #1</text>
<path d="M350 520 L510 520" stroke="#f85149" stroke-width="1" stroke-dasharray="3 4"/>
<text x="680" y="524" font-size="13" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">0</text>
<text x="860" y="524" font-size="13" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">0 ETH</text>
<text x="680" y="470" font-size="13" fill="#f85149">Cada withdraw anota</text>
<text x="680" y="490" font-size="13" fill="#f85149">al salir: demasiado tarde</text>
<text x="480" y="580" font-size="13" fill="#8b949e" text-anchor="middle">Las tres llamadas a withdraw leen el mismo saldo de 1 ETH: ninguna ha llegado aún a la línea que lo pone a 0.</text>
</g></svg>
