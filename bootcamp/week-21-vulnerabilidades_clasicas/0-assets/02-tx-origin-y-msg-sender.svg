<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-label="Alice firma una transacción que llama a Middle, y Middle llama a Inner. En Middle, msg.sender es Alice y tx.origin es Alice. En Inner, msg.sender es Middle y tx.origin sigue siendo Alice. Una cartera que comprueba tx.origin acepta la llamada de Middle como si fuera de Alice">
<title>tx.origin y msg.sender en una cadena de llamadas</title>
<rect width="960" height="420" fill="#0d1117"/>
<g font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif">
<rect x="40" y="40" width="220" height="70" rx="8" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
<text x="150" y="70" font-size="16" fill="#f0f6fc" text-anchor="middle">Alice</text>
<text x="150" y="94" font-size="12" fill="#8b949e" text-anchor="middle">cuenta con clave (EOA)</text>
<rect x="370" y="40" width="220" height="70" rx="8" fill="#161b22" stroke="#f85149" stroke-width="2"/>
<text x="480" y="70" font-size="16" fill="#f0f6fc" text-anchor="middle">Middle</text>
<text x="480" y="94" font-size="12" fill="#8b949e" text-anchor="middle">contrato</text>
<rect x="700" y="40" width="220" height="70" rx="8" fill="#161b22" stroke="#627eea" stroke-width="2"/>
<text x="810" y="70" font-size="16" fill="#f0f6fc" text-anchor="middle">Inner</text>
<text x="810" y="94" font-size="12" fill="#8b949e" text-anchor="middle">contrato</text>
<path d="M260 75 L370 75" stroke="#58a6ff" stroke-width="2"/>
<path d="M360 69 L370 75 L360 81" stroke="#58a6ff" stroke-width="2" fill="none"/>
<text x="315.0" y="65" font-size="13" fill="#f0f6fc" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">forward(inner)</text>
<text x="315.0" y="95" font-size="12" fill="#8b949e" text-anchor="middle">firma la tx</text>
<path d="M590 75 L700 75" stroke="#58a6ff" stroke-width="2"/>
<path d="M690 69 L700 75 L690 81" stroke="#58a6ff" stroke-width="2" fill="none"/>
<text x="645.0" y="65" font-size="13" fill="#f0f6fc" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">who()</text>
<text x="645.0" y="95" font-size="12" fill="#8b949e" text-anchor="middle">llamada entre contratos</text>
<rect x="340" y="160" width="280" height="96" rx="8" fill="#161b22" stroke="#30363d"/>
<text x="360" y="194" font-size="14" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">msg.sender</text>
<text x="600" y="194" font-size="14" fill="#3fb950" text-anchor="end">Alice</text>
<line x1="360" y1="208" x2="600" y2="208" stroke="#30363d"/>
<text x="360" y="236" font-size="14" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">tx.origin</text>
<text x="600" y="236" font-size="14" fill="#f0f6fc" text-anchor="end">Alice</text>
<line x1="480" y1="110" x2="480" y2="160" stroke="#30363d" stroke-dasharray="4 4"/>
<rect x="670" y="160" width="280" height="96" rx="8" fill="#161b22" stroke="#30363d"/>
<text x="690" y="194" font-size="14" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">msg.sender</text>
<text x="930" y="194" font-size="14" fill="#e3b341" text-anchor="end">Middle</text>
<line x1="690" y1="208" x2="930" y2="208" stroke="#30363d"/>
<text x="690" y="236" font-size="14" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">tx.origin</text>
<text x="930" y="236" font-size="14" fill="#f0f6fc" text-anchor="end">Alice</text>
<line x1="810" y1="110" x2="810" y2="160" stroke="#30363d" stroke-dasharray="4 4"/>
<text x="150" y="194" font-size="14" fill="#8b949e" text-anchor="middle">Lo que ve</text>
<text x="150" y="216" font-size="14" fill="#8b949e" text-anchor="middle">cada contrato</text>
<rect x="40" y="290" width="420" height="96" rx="8" fill="#161b22" stroke="#f85149" stroke-width="2"/>
<text x="60" y="320" font-size="14" fill="#f85149" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">if (tx.origin != owner) revert</text>
<text x="60" y="346" font-size="13" fill="#f0f6fc">En Inner ve a Alice: la llamada de Middle pasa.</text>
<text x="60" y="368" font-size="13" fill="#8b949e">Si Middle es un cebo, roba con el permiso de Alice.</text>
<rect x="500" y="290" width="420" height="96" rx="8" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
<text x="520" y="320" font-size="14" fill="#3fb950" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">if (msg.sender != owner) revert</text>
<text x="520" y="346" font-size="13" fill="#f0f6fc">En Inner ve a Middle: la llamada revierte.</text>
<text x="520" y="368" font-size="13" fill="#8b949e">Solo Alice, llamando ella, tiene permiso.</text>
</g></svg>
