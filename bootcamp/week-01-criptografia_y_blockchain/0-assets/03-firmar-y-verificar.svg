<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 360" role="img" aria-label="Arriba, Ana firma: el mensaje y su clave privada entran a la función de firma y sale una firma de 65 bytes. Abajo, cualquiera verifica: con el mensaje, la firma y la dirección de Ana, la verificación responde sí o no. La clave privada nunca viaja.">
  <title>Firmar y verificar un mensaje</title>
  <rect width="880" height="360" fill="#0d1117"/>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#58a6ff"/></marker></defs>
  <g font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif">
    <text x="20" y="34" font-size="16" font-weight="700" fill="#f0f6fc">1. Ana firma (en su máquina)</text>
    <g fill="#161b22" stroke-width="2">
      <rect x="20" y="52" width="170" height="44" rx="8" stroke="#30363d"/>
      <rect x="20" y="108" width="170" height="44" rx="8" stroke="#f85149"/>
      <rect x="290" y="78" width="160" height="50" rx="8" stroke="#627eea"/>
      <rect x="550" y="78" width="200" height="50" rx="8" stroke="#3fb950"/>
    </g>
    <g font-size="14" text-anchor="middle" fill="#f0f6fc">
      <text x="105" y="79">mensaje "hola"</text>
      <text x="105" y="135">clave privada de Ana</text>
      <text x="370" y="108">sign</text>
      <text x="650" y="102">firma (65 bytes)</text>
      <text x="650" y="120" font-size="12" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">0x1b4a…941c</text>
    </g>
    <g stroke="#58a6ff" stroke-width="2" marker-end="url(#a)">
      <line x1="192" y1="74" x2="286" y2="96"/><line x1="192" y1="130" x2="286" y2="112"/><line x1="452" y1="103" x2="546" y2="103"/>
    </g>

    <line x1="20" y1="180" x2="860" y2="180" stroke="#30363d" stroke-dasharray="6 6"/>
    <text x="440" y="172" font-size="12" fill="#8b949e" text-anchor="middle">viajan el mensaje y la firma; la clave privada se queda con Ana</text>

    <text x="20" y="214" font-size="16" font-weight="700" fill="#f0f6fc">2. Cualquiera verifica (sin secretos)</text>
    <g fill="#161b22" stroke-width="2">
      <rect x="20" y="232" width="170" height="36" rx="8" stroke="#30363d"/>
      <rect x="20" y="276" width="170" height="36" rx="8" stroke="#3fb950"/>
      <rect x="20" y="320" width="170" height="32" rx="8" stroke="#627eea"/>
      <rect x="290" y="264" width="160" height="50" rx="8" stroke="#627eea"/>
      <rect x="550" y="240" width="200" height="40" rx="8" stroke="#3fb950"/>
      <rect x="550" y="296" width="200" height="40" rx="8" stroke="#f85149"/>
    </g>
    <g font-size="14" text-anchor="middle" fill="#f0f6fc">
      <text x="105" y="255">mensaje "hola"</text>
      <text x="105" y="299">firma</text>
      <text x="105" y="341">dirección de Ana</text>
      <text x="370" y="294">verify</text>
      <text x="650" y="265">Sí: Ana firmó esto</text>
      <text x="650" y="321">No: otro mensaje u otra clave</text>
    </g>
    <g stroke="#58a6ff" stroke-width="2" marker-end="url(#a)">
      <line x1="192" y1="250" x2="286" y2="280"/><line x1="192" y1="294" x2="286" y2="290"/><line x1="192" y1="336" x2="286" y2="302"/>
      <line x1="452" y1="282" x2="546" y2="262"/><line x1="452" y1="298" x2="546" y2="314"/>
    </g>
  </g>
</svg>
