<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" role="img" aria-label="A la izquierda, un registro central: un banco guarda la única copia y los usuarios dependen de él. A la derecha, un registro replicado: cinco nodos guardan la misma copia y se la comunican entre sí.">
  <title>Registro central frente a registro replicado</title>
  <rect width="880" height="400" fill="#0d1117"/>
  <g font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif">
    <text x="210" y="40" font-size="18" font-weight="700" fill="#f0f6fc" text-anchor="middle">Registro central</text>
    <text x="660" y="40" font-size="18" font-weight="700" fill="#f0f6fc" text-anchor="middle">Registro replicado (blockchain)</text>
    <line x1="440" y1="24" x2="440" y2="376" stroke="#30363d" stroke-width="2"/>

    <!-- Central -->
    <rect x="140" y="160" width="140" height="80" rx="10" fill="#161b22" stroke="#f85149" stroke-width="2"/>
    <text x="210" y="195" font-size="15" fill="#f0f6fc" text-anchor="middle">Banco</text>
    <text x="210" y="217" font-size="13" fill="#8b949e" text-anchor="middle">única copia</text>
    <g fill="#161b22" stroke="#30363d">
      <circle cx="70" cy="90" r="26"/><circle cx="350" cy="90" r="26"/>
      <circle cx="70" cy="310" r="26"/><circle cx="350" cy="310" r="26"/>
    </g>
    <g font-size="13" fill="#f0f6fc" text-anchor="middle">
      <text x="70" y="95">Ana</text><text x="350" y="95">Luis</text>
      <text x="70" y="315">Eva</text><text x="350" y="315">Raúl</text>
    </g>
    <g stroke="#58a6ff" stroke-width="2">
      <line x1="92" y1="104" x2="150" y2="160"/><line x1="328" y1="104" x2="270" y2="160"/>
      <line x1="92" y1="296" x2="150" y2="240"/><line x1="328" y1="296" x2="270" y2="240"/>
    </g>
    <text x="210" y="370" font-size="13" fill="#f85149" text-anchor="middle">Si el banco falla, censura o altera, nadie puede comprobarlo</text>

    <!-- Replicado -->
    <g stroke="#627eea" stroke-width="2">
      <line x1="660" y1="110" x2="540" y2="190"/><line x1="660" y1="110" x2="780" y2="190"/>
      <line x1="540" y1="190" x2="590" y2="310"/><line x1="780" y1="190" x2="730" y2="310"/>
      <line x1="590" y1="310" x2="730" y2="310"/><line x1="660" y1="110" x2="590" y2="310"/>
      <line x1="660" y1="110" x2="730" y2="310"/><line x1="540" y1="190" x2="780" y2="190"/>
    </g>
    <g fill="#161b22" stroke="#627eea" stroke-width="2">
      <rect x="610" y="80" width="100" height="56" rx="8"/><rect x="490" y="162" width="100" height="56" rx="8"/>
      <rect x="730" y="162" width="100" height="56" rx="8"/><rect x="540" y="282" width="100" height="56" rx="8"/>
      <rect x="680" y="282" width="100" height="56" rx="8"/>
    </g>
    <g font-size="13" text-anchor="middle">
      <text x="660" y="104" fill="#f0f6fc">Nodo A</text><text x="540" y="186" fill="#f0f6fc">Nodo B</text>
      <text x="780" y="186" fill="#f0f6fc">Nodo C</text><text x="590" y="306" fill="#f0f6fc">Nodo D</text>
      <text x="730" y="306" fill="#f0f6fc">Nodo E</text>
      <text x="660" y="124" fill="#8fa4f0">copia completa</text><text x="540" y="206" fill="#8fa4f0">copia completa</text>
      <text x="780" y="206" fill="#8fa4f0">copia completa</text><text x="590" y="326" fill="#8fa4f0">copia completa</text>
      <text x="730" y="326" fill="#8fa4f0">copia completa</text>
    </g>
    <text x="660" y="370" font-size="13" fill="#3fb950" text-anchor="middle">Cada nodo verifica todo; alterar una copia no cambia las demás</text>
  </g>
</svg>
